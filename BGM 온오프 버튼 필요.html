                audio.pause();

          }, [gameState]);

            const day = Math.floor(totalH / 24) + 1;
            const hour = totalH % 24;
            return `D-${day} ${hour.toString().padStart(2, '0')}:00`;
          };

            return msgs[Math.floor(Math.random() * msgs.length)];
          };

          const handleDeath = (category, causeTitle) => {
            const desc = getRandomDeathMessage(category);
            setDeathCause({ title: causeTitle, desc });
            setIsPlaying(false);
            setTimeout(() => setGameState('gameover'), 800);
          };

          const generateNextRescue = (currentTotalHours) => {
            const currentDay = Math.floor(currentTotalHours / 24) + 1;
            const nextDay = Math.ceil(currentDay / 3) * 3 || 3;
            const targetDay = currentDay >= nextDay ? currentDay + 3 : nextDay;
            const hour = Math.floor(Math.random() * 15) + 8; 
            const randomLoc = LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)].id;
            return { targetDay, hour, locationId: randomLoc };
          };

          const startGame = () => {
            const spawnPoint = RESPAWN_LOCATIONS[Math.floor(Math.random() * RESPAWN_LOCATIONS.length)];
            const assignedTrait = TRAITS_POOL[Math.floor(Math.random() * TRAITS_POOL.length)];
            const randomItem = START_ITEMS_POOL[Math.floor(Math.random() * START_ITEMS_POOL.length)];
            const maxHealth = assignedTrait.id === 'strong' ? 120 : 100;

            const initialDurability = {};
            if (WEAPONS.includes(randomItem)) {
              initialDurability[randomItem] = 2;
            }

            const initialRescue = generateNextRescue(8);
            setRescueInfo(initialRescue);

            setTrait(assignedTrait);
            setCounters({ totalHours: 8, zombiesKilled: 0, hasShelter: spawnPoint.hasShelter, locationHours: 0 });
            setStats({ health: maxHealth, hunger: 100, mental: 100, hygiene: 100 });
            setFlags({});
            setCompanions([]);
            setInventory([randomItem]);
            setWeaponDurability(initialDurability);
            setRecentEventIds([]);
            setReservedLocation(null);
            setTravelState(null);
            setVehicle(null);
            setDeathCause({ title: '', desc: '' });
            setCurrentLocation(spawnPoint.id);

            setLogs([
              { timeStr: formatTime(8), text: `[성별: ${player.gender}] 특성 [${assignedTrait.name}]을(를) 가지고 생존을 시작합니다.`, type: 'event' },
              { timeStr: formatTime(8), text: spawnPoint.log, type: 'normal' }
            ]);
            setGameState('playing');
            setIsPlaying(true);
          };

          const checkSynergies = () => {
            const cIds = companions.map(c => c.id);
            return {
              tacticalUnit: cIds.includes('police') && cIds.includes('soldier'), 
              medicalTeam: cIds.includes('nurse') && cIds.includes('pharmacist'), 
              survivalBase: cIds.includes('chef') && cIds.includes('engineer'), 
              wildBeasts: cIds.includes('military_dog') && cIds.includes('stray_cat') 
            };
          };

          const applyCompanionAndTraitEffects = (currentStats) => {
            let healthGain = 0;
            let hungerExtraLoss = companions.filter(c => c.role !== '길고양이' && c.role !== '군견').length * 1; 
            let mentalGain = 0;

            const synergies = checkSynergies();

            if (companions.some(c => c.id === 'nurse')) healthGain += (synergies.medicalTeam ? 7 : 4);
            if (companions.some(c => c.id === 'stray_cat')) mentalGain += (synergies.wildBeasts ? 5 : 3);
            if (trait?.id === 'clean_freak' && currentStats.hygiene >= 80) mentalGain += 3;
            
            const highAffinityCount = companions.filter(c => c.affinity >= 80).length;
            mentalGain += (highAffinityCount * 2);

            const maxHealth = trait?.id === 'strong' ? 120 : 100;
            return {
              ...currentStats,
              health: Math.min(maxHealth, currentStats.health + healthGain),
              hunger: Math.max(0, currentStats.hunger - hungerExtraLoss),
              mental: Math.min(100, currentStats.mental + mentalGain)
            };
          };

          useEffect(() => {
            if (gameState !== 'playing') return;

            const maxHealth = trait?.id === 'strong' ? 120 : 100;

            if (stats.health < maxHealth * 0.10 && inventory.includes('medkit')) {
              handleCraftingUse('heal');
              setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 건강 위험(10% 미만)! [구급상자]를 자동으로 사용했습니다.", type: 'event' }].slice(-MAX_LOGS));
            }

            if (stats.hunger < 10 && inventory.includes('ration')) {
              handleCraftingUse('eat_ration');
              setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 허기 위험(10% 미만)! [전투식량]을 자동으로 섭취했습니다.", type: 'event' }].slice(-MAX_LOGS));
            }

            if (stats.mental < 10) {
              if (inventory.includes('chocolate')) {
                handleCraftingUse('use_chocolate');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 정신력 위험(10% 미만)! [초콜릿]을 자동으로 먹었습니다.", type: 'event' }].slice(-MAX_LOGS));
              } else if (inventory.includes('coffee')) {
                handleCraftingUse('use_coffee');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 정신력 위험(10% 미만)! [캔커피]를 자동으로 마셨습니다.", type: 'event' }].slice(-MAX_LOGS));
              } else if (inventory.includes('lighter') && inventory.includes('cigarette')) {
                handleCraftingUse('smoke');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 정신력 위험(10% 미만)! [담배]를 자동으로 피웠습니다.", type: 'event' }].slice(-MAX_LOGS));
              }
            }

            if (stats.hygiene < 10) {
              if (inventory.includes('soap')) {
                handleCraftingUse('use_soap');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 위생 위험(10% 미만)! [비누]를 자동으로 사용했습니다.", type: 'event' }].slice(-MAX_LOGS));
              } else if (inventory.includes('wet_wipes')) {
                handleCraftingUse('use_wipes');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 위생 위험(10% 미만)! [물티슈]를 자동으로 사용했습니다.", type: 'event' }].slice(-MAX_LOGS));
              }
            }

            if (vehicle && VEHICLE_TYPES[vehicle.id]?.type !== 'stamina' && vehicle.cap < 10) {
              if ((vehicle.id === 'motorcycle' || vehicle.id === 'car') && inventory.includes('gas_can')) {
                handleCraftingUse('refuel_vehicle');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 차량 연료 부족(10% 미만)! [휘발유 캔]을 자동으로 주유했습니다.", type: 'event' }].slice(-MAX_LOGS));
              } else if (vehicle.id === 'kickboard' && inventory.includes('battery_pack')) {
                handleCraftingUse('charge_kickboard');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 킥보드 배터리 부족(10% 미만)! [휴대용 배터리]를 자동으로 충전했습니다.", type: 'event' }].slice(-MAX_LOGS));
              }
            }
          }, [stats, vehicle, inventory, gameState, counters.totalHours, trait]);

          useEffect(() => {
            if (!isPlaying || gameState !== 'playing' || gameSpeed === 0 || activeEvent || discardModal.open) return;

            const intervalTime = 2500 / gameSpeed;

            const timer = setInterval(() => {
              let baseHoursPassed = Math.floor(Math.random() * 2) + 1;
              let hoursPassed = baseHoursPassed;
              
              if (travelState && travelState.hoursLeft < hoursPassed) {
                  hoursPassed = travelState.hoursLeft;
              }

              const newHours = counters.totalHours + hoursPassed;
              const daysSurvived = Math.floor(newHours / 24);
              const curDay = Math.floor(newHours / 24) + 1;
              const curHour = newHours % 24;

              let currentRescue = rescueInfo;
              const rescueTotalHours = (currentRescue.targetDay - 1) * 24 + currentRescue.hour;
              
              if (counters.totalHours <= rescueTotalHours && newHours >= rescueTotalHours) {
                  if (currentLocation === currentRescue.locationId) {
                      const targetLocName = LOCATIONS.find(l => l.id === currentRescue.locationId)?.name;
                      setActiveEvent({
                        id: 'rescue_ending_event',
                        text: `🚁 [구조대 도착!] 굉음을 내며 [${targetLocName}] 상공에 군용 구조 헬리콥터가 착륙합니다! 무전기로 정보를 파악하고 제시간에 도착한 당신을 향해 구호 대원들이 신호를 보냅니다!`,
                        choices: [
                          {
                            text: "🚁 구조 헬기에 탑승하여 아포칼립스를 탈출한다! (생존 성공)",
                            action: () => {
                              setIsPlaying(false);
                              setTimeout(() => setGameState('victory'), 500);
                              return { log: "🎉 축하합니다! 무사히 구조대의 헬기에 탑승하여 죽음의 도시를 탈출했습니다!" };
                            }
                          }
                        ]
                      });
                      setIsPlaying(false);
                      return;
                  }
              }

              if (newHours > rescueTotalHours) {
                  currentRescue = generateNextRescue(newHours);
                  setRescueInfo(currentRescue);
              }

              const difficultyMultiplier = 1 + (daysSurvived * 0.08);

              const synergies = checkSynergies();

              let chefMultiplier = companions.some(c => c.id === 'chef') ? 0.75 : 1.0;
              if (synergies.survivalBase) chefMultiplier = 0.50; 

              const isPharmacistActive = companions.some(c => c.id === 'pharmacist');
              const baseHealthDecayRate = (stats.hygiene < 20 && !isPharmacistActive && !synergies.medicalTeam ? 4 : (counters.hasShelter ? 1 : 2));
              
              let engineerHygieneMod = companions.some(c => c.id === 'engineer') ? 0.7 : 1.0;
              if (synergies.survivalBase) engineerHygieneMod = 0.0; 

              const healthDecay = baseHealthDecayRate * difficultyMultiplier;
              const hungerDecay = 3 * difficultyMultiplier * chefMultiplier;
              const mentalDecayRate = trait?.id === 'calm' ? 0.5 : 1;
              const mentalDecay = ((counters.hasShelter ? 1 : 3) * mentalDecayRate) * difficultyMultiplier;
              const hygieneDecay = (counters.hasShelter ? 2 : 4) * difficultyMultiplier * engineerHygieneMod;

              let nextStats = {
                health: Math.max(0, stats.health - healthDecay),
                hunger: Math.max(0, stats.hunger - hungerDecay),
                mental: Math.max(0, stats.mental - mentalDecay),
                hygiene: Math.max(0, stats.hygiene - hygieneDecay)
              };

              if (nextStats.hunger < 30) nextStats.health = Math.max(0, nextStats.health - 2 * difficultyMultiplier);
              if (nextStats.hygiene < 30 && !isPharmacistActive && !synergies.medicalTeam) nextStats.mental = Math.max(0, nextStats.mental - 2 * difficultyMultiplier);
              if (nextStats.mental < 30) nextStats.hunger = Math.max(0, nextStats.hunger - 1 * difficultyMultiplier);
              if (nextStats.hunger >= 80 && nextStats.hygiene >= 80) nextStats.mental = Math.min(100, nextStats.mental + 1);
              
              nextStats = applyCompanionAndTraitEffects(nextStats);

              setCompanions(prevComps => prevComps.map(c => {
                let loyaltyLoss = 1;
                let affinityLoss = 0;
                if (nextStats.hunger <= 30) { loyaltyLoss += 2; affinityLoss += 1; }
                if (nextStats.hygiene <= 20) loyaltyLoss += 1;
                return { 
                  ...c, 
                  loyalty: Math.max(0, c.loyalty - loyaltyLoss),
                  affinity: Math.max(0, c.affinity - affinityLoss)
                };
              }));

              if (nextStats.health <= 0) {
                setStats(nextStats);
                handleDeath('health', '체력 고갈 : 치명적인 상처와 과다출혈로 사망');
                return;
              }
              if (nextStats.hunger <= 0) {
                setStats(nextStats);
                handleDeath('hunger', '포만감 부족 : 식량을 섭취하지 못하여 아사');
                return;
              }
              if (nextStats.mental <= 0) {
                setStats(nextStats);
                handleDeath('mental', '정신력 고갈 : 살고자 하는 의지를 상실하고 삶을 포기');
                return;
              }

              const stateForCondition = {
                locationHours: counters.locationHours || 0,
                player, trait, stats: nextStats, counters: { ...counters, totalHours: newHours },
                flags, inventory, companions, currentLocation, vehicle, travelState
              };

              const validEvents = EVENTS.filter(e => e.condition(stateForCondition) && !recentEventIds.includes(e.id));
              
              const spawnChance = Math.min(0.95, 0.65 + (daysSurvived * 0.05));
              const triggerRandom = Math.random() < spawnChance;

              let isTravelDone = false;
              let newHoursLeft = travelState ? travelState.hoursLeft - hoursPassed : 0;

              let eventTriggered = false;
              if (validEvents.length > 0 && triggerRandom) {
                const chosenEvent = validEvents[Math.floor(Math.random() * validEvents.length)];
                setRecentEventIds(prev => [...prev.slice(-4), chosenEvent.id]);
                setStats(nextStats);
                
                if (travelState) {
                  if (newHoursLeft <= 0) {
                      setTravelState(null);
                      setCurrentLocation(travelState.targetLoc);
                      setCounters(c => ({ ...c, totalHours: newHours, locationHours: 0 }));
                      setLogs(l => [...l, { timeStr: formatTime(newHours), text: `[목적지 도착] ${travelState.destName}에 도착했습니다.`, type: 'event' }].slice(-MAX_LOGS));
                  } else {
                      setTravelState({ ...travelState, hoursLeft: newHoursLeft });
                      setCounters(c => ({ ...c, totalHours: newHours, locationHours: (c.locationHours || 0) + hoursPassed }));
                  }
                } else {
                  setCounters(c => ({ ...c, totalHours: newHours, locationHours: (c.locationHours || 0) + hoursPassed }));
                }

                setActiveEvent(chosenEvent);
                setIsPlaying(false);
                eventTriggered = true;
              }

              if (!eventTriggered) {
                if (travelState) {
                  if (newHoursLeft <= 0) {
                    setCurrentLocation(travelState.targetLoc);
                    setTravelState(null);
                    setCounters(c => ({ ...c, totalHours: newHours, locationHours: 0 }));
                    setLogs(l => [...l, { timeStr: formatTime(newHours), text: `[목적지 도착] ${travelState.destName}에 도착했습니다.`, type: 'event' }].slice(-MAX_LOGS));
                  } else {
                    setTravelState({ ...travelState, hoursLeft: newHoursLeft });
                    setCounters(c => ({ ...c, totalHours: newHours, locationHours: (c.locationHours || 0) + hoursPassed }));
                    setLogs(l => [...l, { timeStr: formatTime(newHours), text: `[이동 중] ${travelState.destName}(으)로 이동하고 있습니다... (남은 시간: ${newHoursLeft}시간, 진행: ${hoursPassed}시간 소요)`, type: 'normal' }].slice(-MAX_LOGS));
                  }
                } else {
                  const logsArray = counters.hasShelter ? NORMAL_LOGS.sheltered : NORMAL_LOGS.unsheltered;
                  let randomLog = logsArray[Math.floor(Math.random() * logsArray.length)];
                  
                  if (inventory.includes('radio')) {
                    const targetLocName = LOCATIONS.find(l => l.id === currentRescue.locationId)?.name;
                    randomLog += ` 📻 [무전기 수신] D-${currentRescue.targetDay} ${currentRescue.hour.toString().padStart(2, '0')}:00에 [${targetLocName}] 구역으로 구조대가 도착합니다! (도착 시간에 맞춰 해당 장소에 있어야 구조될 수 있습니다!)`;
                  }

                  if (!counters.hasShelter && randomLog.includes("쓰레기통을 뒤집니다")) {
                    if (Math.random() < 0.08) { 
                      const trashPool = ['wet_wipes', 'soap', 'chocolate', 'battery_pack', 'cigarette', 'lighter'];
                      const foundItem = trashPool[Math.floor(Math.random() * trashPool.length)];
                      const foundItemName = getItemVisual(foundItem).name;
                      randomLog = `쓰레기통을 뒤지던 중 유용한 [${foundItemName}]을(를) 발견하여 챙겼습니다!`;
                      
                      if (inventory.length < maxInventorySlots) {
                        setInventory(inv => {
                          if (WEAPONS.includes(foundItem)) {
                            setWeaponDurability(d => ({ ...d, [foundItem]: 2 }));
                          }
                          return [...inv, foundItem];
                        });
                      } else {
                        setIsPlaying(false);
                        setDiscardModal({ open: true, pendingItems: [foundItem] });
                      }
                    }
                  }
                  setCounters(c => ({ ...c, totalHours: newHours, locationHours: (c.locationHours || 0) + hoursPassed }));
                  setLogs(l => [...l, { timeStr: formatTime(newHours), text: randomLog, type: 'normal' }].slice(-MAX_LOGS));
                }
                setStats(nextStats);
              }

            }, intervalTime);

            return () => clearInterval(timer);
          }, [isPlaying, gameState, gameSpeed, player, trait, stats, counters, flags, inventory, companions, currentLocation, recentEventIds, activeEvent, vehicle, discardModal, weaponDurability, rescueInfo]);

          useEffect(() => {
            if (logContainerRef.current) logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
          }, [logs, activeEvent]);

          const handleChoice = (choice) => {
            const result = choice.action(inventory, counters, trait, companions, vehicle, currentLocation);
            const maxHealth = trait?.id === 'strong' ? 120 : 100;
            
            let logStr = result.log || "";

            let currentInv = [...inventory];
            let currentDurability = { ...weaponDurability };

            if (result.useWeapon) {
              let currentDur = currentDurability[result.useWeapon] !== undefined ? currentDurability[result.useWeapon] : 2;
              currentDur -= 1;

              if (currentDur <= 0) {
                const idx = currentInv.indexOf(result.useWeapon);
                if (idx > -1) {
                  currentInv.splice(idx, 1);
                }
                delete currentDurability[result.useWeapon];
                const wName = getItemVisual(result.useWeapon).name;
                logStr += `\n💥 무기 [${wName}]의 내구도가 모두 소진되어 내구도 한계로 파괴되었습니다!`;
              } else {
                currentDurability[result.useWeapon] = currentDur;
                const wName = getItemVisual(result.useWeapon).name;
                logStr += `\n⚔️ 무기 [${wName}] 사용! (남은 내구도: ${currentDur}/2)`;
              }
            }

            if (result.setVehicle !== undefined) setVehicle(result.setVehicle);
            if (result.addTravelTime) setTravelState(prev => prev ? { ...prev, hoursLeft: prev.hoursLeft + result.addTravelTime } : null);

            const synergies = checkSynergies();

            setStats(prev => {
              let healthDelta = result.stats?.health || 0;
              
              if (healthDelta < 0) {
                if (synergies.tacticalUnit) {
                  healthDelta = Math.round(healthDelta * 0.25); 
                  logStr = `🛡️ [시너지: 치안유지조] 지헌과 박상사의 철통 호흡으로 피해를 75%나 방어했습니다!\n` + logStr;
                } else if (companions.some(c => c.id === 'soldier')) {
                  healthDelta = Math.round(healthDelta * 0.7); 
                } else if (companions.some(c => c.id === 'police')) {
                  healthDelta = Math.round(healthDelta * 0.65); 
                  logStr = `👮 [경찰관 '지헌'] 지헌이 피해를 차단했습니다!\n` + logStr;
                }

                if (companions.some(c => c.id === 'military_dog')) {
                  healthDelta = Math.round(healthDelta * 0.8);
                  logStr = `🐕 [군견 '제로'] 군견이 경계하며 위협을 완화시켰습니다!\n` + logStr;
                }

                if (healthDelta < -15 && companions.some(c => c.affinity >= 80)) {
                  if(Math.random() < 0.48) {
                    healthDelta = Math.round(healthDelta * 0.5);
                    logStr = `💖 [협동] 호감도 높은 동료가 위험을 함께 막아 피해를 줄였습니다!\n` + logStr;
                  }
                }
              }

              const newStats = {
                health: Math.min(maxHealth, Math.max(0, prev.health + healthDelta)),
                hunger: Math.min(100, Math.max(0, prev.hunger + (result.stats?.hunger || 0))),
                mental: Math.min(100, Math.max(0, prev.mental + (result.stats?.mental || 0))),
                hygiene: Math.min(100, Math.max(0, prev.hygiene + (result.stats?.hygiene || 0)))
              };

              if (newStats.health <= 0) handleDeath('health', '체력 고갈 : 치명적인 상처와 과다출혈로 사망');
              else if (newStats.hunger <= 0) handleDeath('hunger', '포만감 부족 : 식량을 섭취하지 못하여 아사');
              else if (newStats.mental <= 0) handleDeath('mental', '정신력 고갈 : 살고자 하는 의지를 상실하고 삶을 포기');

              return newStats;
            });

            if (result.flags && result.flags.triggerVaccineEnding) {
              setIsPlaying(false);
              setTimeout(() => setGameState('victory_vaccine'), 500);
              delete result.flags.triggerVaccineEnding;
            }
            if (result.flags && result.flags.triggerBetrayalEnding) {
              setIsPlaying(false);
              setTimeout(() => setGameState('ending_betrayal'), 500);
              delete result.flags.triggerBetrayalEnding;
            }
            if (result.flags && result.flags.triggerMutantEnding) {
              setIsPlaying(false);
              setTimeout(() => setGameState('ending_mutant'), 500);
              delete result.flags.triggerMutantEnding;
            }
            if (result.flags && result.flags.triggerPlaneEnding) {
              setIsPlaying(false);
              setTimeout(() => setGameState('ending_plane'), 500);
              delete result.flags.triggerPlaneEnding;
            }

            if (result.flags) setFlags(prev => ({ ...prev, ...result.flags }));

            if (result.updateLoyalty || result.updateAffinity) {
              setCompanions(prev => prev.map(c => {
                let newC = { ...c };
                if (result.updateLoyalty && c.id === result.updateLoyalty.id) newC.loyalty = Math.min(100, Math.max(0, newC.loyalty + result.updateLoyalty.delta));
                if (result.updateAffinity && c.id === result.updateAffinity.id) newC.affinity = Math.min(100, Math.max(0, newC.affinity + result.updateAffinity.delta));
                return newC;
              }));
            }

            if (result.itemsLost) {
              result.itemsLost.forEach(itemToLose => {
                const idx = currentInv.indexOf(itemToLose);
                if (idx > -1) {
                  currentInv.splice(idx, 1);
                  if (WEAPONS.includes(itemToLose)) {
                    delete currentDurability[itemToLose];
                  }
                }
              });
            }

            let pendingItemsToModal = [];

            if (result.itemsGained) {
              if (companions.some(c => c.id === 'stray_cat') && Math.random() < 0.25) {
                result.itemsGained.push('pet_food');
                logStr += " 🐈 (고양이 '나비'가 구석에서 사료 봉지를 물어왔습니다!)";
              }

              result.itemsGained.forEach(item => {
                if (WEAPONS.includes(item) && currentDurability[item] === undefined) {
                  currentDurability[item] = 2;
                }
                if (currentInv.length < maxInventorySlots) {
                  currentInv.push(item);
                } else {
                  pendingItemsToModal.push(item);
                }
              });
            }

            setInventory(currentInv);
            setWeaponDurability(currentDurability);

            if (result.addCompanion) setCompanions(prev => [...prev, result.addCompanion]);
            if (result.removeCompanionId) setCompanions(prev => prev.filter(c => c.id !== result.removeCompanionId));

            if (logStr) setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: logStr, type: 'event' }].slice(-MAX_LOGS));
            
            setActiveEvent(null);

            if (pendingItemsToModal.length > 0) {
              setIsPlaying(false);
              setDiscardModal({ open: true, pendingItems: pendingItemsToModal });
            } else {
              setTimeout(() => {
                setStats(currentStats => { 
                  if(gameState === 'playing' && currentStats.health > 0 && currentStats.hunger > 0 && currentStats.mental > 0) setIsPlaying(true);
                  return currentStats;
                });
              }, 600);
            }
          };

          const handleSelectLocation = (locId) => {
            if (locId === currentLocation && !travelState) return;
            if (activeEvent) {
              setReservedLocation(locId);
              setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: `[이동 예약] 현재 상황이 종료된 후 [${LOCATIONS.find(l => l.id === locId)?.name}](으)로 자동 이동합니다.`, type: 'event' }].slice(-MAX_LOGS));
              return;
            }
            
            const targetLoc = LOCATIONS.find(l => l.id === locId);
            const currentLoc = LOCATIONS.find(l => l.id === currentLocation) || LOCATIONS[0];
            
            const dist = Math.abs(targetLoc.distance - currentLoc.distance);
            let baseHours = 1 + (dist * 2);

            let vData = vehicle ? VEHICLE_TYPES[vehicle.id] : null;
            let actualTravelTime = baseHours;
            let vehicleStatusNote = "";

            if (vehicle && vData) {
              actualTravelTime = Math.max(1, Math.round(baseHours * vData.speedMult));
              const cost = dist * vData.costPerDist;

              if (vData.type === 'stamina') {
                setStats(s => ({ ...s, hunger: Math.max(0, s.hunger - cost), health: Math.max(1, s.health - Math.round(cost/2)) }));
                vehicleStatusNote = ` (🚲 자전거 이동: 체력/포만감 추가 소모)`;
              } else {
                if (vehicle.cap >= cost) {
                  setVehicle(v => ({ ...v, cap: v.cap - cost }));
                  vehicleStatusNote = ` (${vData.name} 이동: 게이지 -${cost}%)`;
                } else {
                  actualTravelTime = baseHours;
                  vehicleStatusNote = ` (⚠️ ${vData.name} 연료/배터리 부족으로 도보 이동)`;
                }
              }
            }

            setCounters(prev => ({ ...prev, hasShelter: false }));
            setTravelState({ targetLoc: targetLoc.id, hoursLeft: actualTravelTime, destName: targetLoc.name, vehicleNote: vehicleStatusNote });
            setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: `[이동 시작] ${targetLoc.name}(으)로 이동합니다. (예상 소요 시간: ${actualTravelTime}시간)${vehicleStatusNote}`, type: 'event' }].slice(-MAX_LOGS));
            setIsPlaying(true);
          };

          useEffect(() => {
            if (!activeEvent && reservedLocation && isPlaying && gameState === 'playing') {
              const loc = reservedLocation;
              setReservedLocation(null);
            setTravelState(null);
              handleSelectLocation(loc);
            }
          }, [activeEvent, reservedLocation, isPlaying, gameState]);

          const handleCraftingUse = (actionType) => {
            const maxHealth = trait?.id === 'strong' ? 120 : 100;
            const synergies = checkSynergies();

            if (actionType === 'smoke') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('cigarette'), 1); return newInv; });
              setStats(prev => ({ ...prev, mental: Math.min(100, prev.mental + 40) }));
            } else if (actionType === 'heal') {
              let healAmount = companions.some(c => c.id === 'pharmacist') ? 70 : 50;
              if (synergies.medicalTeam) healAmount = 90; 
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('medkit'), 1); return newInv; });
              setStats(prev => ({ ...prev, health: Math.min(maxHealth, prev.health + healAmount) }));
            } else if (actionType === 'eat_ration') {
              const hungerAmount = companions.some(c => c.id === 'chef') ? 50 : 40;
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('ration'), 1); return newInv; });
              setStats(prev => ({ ...prev, hunger: Math.min(100, prev.hunger + hungerAmount), health: Math.min(maxHealth, prev.health + 10) }));
              setCompanions(prev => prev.map(c => ({ ...c, loyalty: Math.min(100, c.loyalty + 10), affinity: Math.min(100, c.affinity + 5) })));
            } else if (actionType === 'use_soap') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('soap'), 1); return newInv; });
              setStats(prev => ({ ...prev, hygiene: Math.min(100, prev.hygiene + 60), mental: Math.min(100, prev.mental + 10) }));
            } else if (actionType === 'use_wipes') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('wet_wipes'), 1); return newInv; });
              setStats(prev => ({ ...prev, hygiene: Math.min(100, prev.hygiene + 35) }));
            } else if (actionType === 'refuel_vehicle') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('gas_can'), 1); return newInv; });
              setVehicle(v => ({ ...v, cap: Math.min(100, v.cap + 50) }));
            } else if (actionType === 'charge_kickboard') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('battery_pack'), 1); return newInv; });
              setVehicle(v => ({ ...v, cap: Math.min(100, v.cap + 40) }));
            } else if (actionType === 'use_chocolate') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('chocolate'), 1); return newInv; });
              setStats(prev => ({ ...prev, mental: Math.min(100, prev.mental + 10), hunger: Math.min(100, prev.hunger + 10) }));
            } else if (actionType === 'use_coffee') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('coffee'), 1); return newInv; });
              setStats(prev => ({ ...prev, mental: Math.min(100, prev.mental + 20), hunger: Math.min(100, prev.hunger + 10) }));
            } else if (actionType === 'feed_pet') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('pet_food'), 1); return newInv; });
              setCompanions(prev => prev.map(c => (c.role === '군견' || c.role === '길고양이') ? { ...c, loyalty: 100, affinity: 100 } : c));
              setStats(prev => ({ ...prev, mental: Math.min(100, prev.mental + 25) }));
            }
          };

          const getItemVisual = (id) => {
            const data = { 
              'bat': { icon: '🏏', name: '야구 배트' }, 'medkit': { icon: '🚑', name: '구급상자' }, 
              'lighter': { icon: '🔥', name: '라이터' }, 'cigarette': { icon: '🚬', name: '담배' }, 
              'soju': { icon: '🍾', name: '소주' }, 'baton': { icon: '🚓', name: '진압봉' }, 
              'ration': { icon: '🥫', name: '전투식량' }, 'knife': { icon: '🗡️', name: '군용 단검' },
              'soap': { icon: '🧼', name: '비누' }, 'wet_wipes': { icon: '🧻', name: '물티슈' },
              'radio': { icon: '📻', name: '무전기' }, 'gas_can': { icon: '⛽', name: '휘발유 캔' },
              'battery_pack': { icon: '🔋', name: '휴대용 배터리' }, 'pet_food': { icon: '🥩', name: '반려동물 사료' }, 
              'chocolate': { icon: '🍫', name: '초콜릿' }, 'coffee': { icon: '☕', name: '캔커피' },
              'pistol': { icon: '🔫', name: '권총' }, 'shotgun': { icon: '💥', name: '샷건' }, 'machete': { icon: '🗡️', name: '마체테' },
              'pre_clinical_vaccine': { icon: '💉', name: '비임상 백신' }, 'completed_vaccine': { icon: '🧪', name: '완성된 백신' }
            };
            return data[id] || { icon: '📦', name: '알 수 없음' };
          };

          const handleDiscardChoice = (discardedItemIndex, isPendingItem = false) => {
            if (isPendingItem) {
              const updatedPending = [...discardModal.pendingItems];
              const droppedItem = updatedPending.splice(discardedItemIndex, 1)[0];
              
              setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: `🎒 가방 공간 부족으로 새 아이템 [${getItemVisual(droppedItem).name}] 획득을 포기했습니다.`, type: 'event' }].slice(-MAX_LOGS));
              
              if (updatedPending.length > 0 && inventory.length >= maxInventorySlots) {
                setDiscardModal({ open: true, pendingItems: updatedPending });
              } else {
                let finalDurability = { ...weaponDurability };
                updatedPending.forEach(item => {
                  if (WEAPONS.includes(item) && finalDurability[item] === undefined) {
                    finalDurability[item] = 2;
                  }
                });
                setWeaponDurability(finalDurability);
                setInventory(prev => [...prev, ...updatedPending].slice(0, maxInventorySlots));
                setDiscardModal({ open: false, pendingItems: [] });
                setIsPlaying(true);
              }
            } else {
              const updatedInv = [...inventory];
              const droppedItem = updatedInv.splice(discardedItemIndex, 1)[0];
              
              let finalDurability = { ...weaponDurability };
              if (WEAPONS.includes(droppedItem)) {
                delete finalDurability[droppedItem];
              }

              const nextPending = [...discardModal.pendingItems];
              if (nextPending.length > 0) {
                const newAdded = nextPending.shift();
                
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: `🎒 가방이 가득 차서 [${getItemVisual(droppedItem).name}]을(를) 버리고 [${getItemVisual(newAdded).name}]을(를) 획득했습니다.`, type: 'event' }].slice(-MAX_LOGS));
                
                if (WEAPONS.includes(newAdded) && finalDurability[newAdded] === undefined) {
                  finalDurability[newAdded] = 2;
                }
                updatedInv.push(newAdded);
              } else {
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: `🎒 가방에서 [${getItemVisual(droppedItem).name}]을(를) 버렸습니다.`, type: 'event' }].slice(-MAX_LOGS));
              }
              
              setWeaponDurability(finalDurability);
              setInventory(updatedInv);
              
              if (nextPending.length > 0 && updatedInv.length >= maxInventorySlots) {
                setDiscardModal({ open: true, pendingItems: nextPending });
              } else {
                setDiscardModal({ open: false, pendingItems: [] });
                setIsPlaying(true);
              }
            }
          };

          const currentDay = Math.floor(counters.totalHours / 24) + 1;
          const maxHealth = trait?.id === 'strong' ? 120 : 100;
          const activeSynergies = checkSynergies();

          if (gameState === 'opening') {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-6 font-sans relative">
                <h1 className="text-5xl md:text-7xl font-black text-[#d84b4b] mb-10 tracking-[0.2em] z-10">생존왕 THE ZOMBIE</h1>
                <button onClick={() => setGameState('video')} className="px-12 py-4 border border-[#d84b4b] text-[#d84b4b] hover:bg-[#d84b4b] hover:text-[#0a0505] font-bold tracking-widest transition-colors duration-300 z-10">지옥문 열기</button>
              </div>
            );
          }

          if (gameState === 'video') {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center bg-black relative animate-fade-in">
                <video 
                  autoPlay 
                  onEnded={() => setGameState('setup')} 
                  className="w-full h-full object-cover absolute inset-0"
                  src="https://raw.githubusercontent.com/Yanghj3119/googleaicamp/main/%EC%83%9D%EC%A1%B4%EC%99%95%20%EC%98%A4%ED%94%84%EB%8B%9D%20%EC%98%81%EC%83%81.mp4"
                />
                <button 
                  onClick={() => setGameState('setup')} 
                  className="absolute bottom-10 right-10 px-8 py-3 border border-white/50 bg-black/60 text-white font-bold rounded z-10 hover:bg-black hover:border-white transition-all tracking-widest"
                >
                  스킵하기 ⏭️
                </button>
              </div>
            );
          }

          if (gameState === 'setup') {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-6 font-sans animate-fade-in">
                <div className="w-full max-w-md bg-[#1a1111] border border-[#3a1f1f] p-8 space-y-6 shadow-2xl">
                  <h2 className="text-xl font-black text-[#d84b4b] text-center border-b border-[#3a1f1f] pb-4 tracking-widest">생존자 설정</h2>
                  <div className="space-y-2">
                    <label className="text-xs text-[#8f7a7a] font-bold">생존자 이름</label>
                    <input type="text" value={player.name} onChange={(e) => setPlayer({ ...player, name: e.target.value })} placeholder="이름을 입력하세요" className="w-full bg-[#110b0b] border border-[#3a1f1f] p-3 text-sm focus:border-[#d84b4b] text-[#f8f8f2] outline-none" />
                  </div>
                  <div className="space-y-2">
                    <label className="text-xs text-[#8f7a7a] font-bold">성별 선택</label>
                    <div className="grid grid-cols-2 gap-2">
                      {['남성', '여성'].map(g => (
                        <button key={g} onClick={() => setPlayer({ ...player, gender: g })} className={`py-2.5 text-xs font-bold border transition-colors ${player.gender === g ? 'bg-[#d84b4b] border-[#d84b4b] text-[#0a0505]' : 'bg-[#110b0b] border-[#3a1f1f] text-[#8f7a7a]'}`}>
                          {g === '남성' ? '👨 남성' : '👩 여성'}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="p-5 bg-[#1a1111] border-2 border-[#d84b4b] text-sm text-[#f8f8f2] space-y-2.5 leading-relaxed shadow-[0_0_15px_rgba(216,75,75,0.2)] rounded-sm">
                    <h3 className="text-[#d84b4b] font-black text-base border-b border-[#3a1f1f] pb-2 mb-2">📜 생존수칙 가이드</h3>
                    <p><span className="text-[#a67c00] font-bold">🏆 생존 방법</span>: <br/>
                      <span className="block ml-3 mt-1 text-xs text-[#c7b8b8]">1. <span className="text-[#2e8b57]">📻 무전기 생존엔딩</span>: 무전기 확보 후 구조대 도착 시간에 맞춰 해당 장소로 이동</span>
                      <span className="block ml-3 text-xs text-[#c7b8b8]">2. <span className="text-[#5a86b5]">🧪 백신 개발 엔딩</span>: 연구소에서 비임상 백신 확보 후 백신개발자와 반려동물을 통해 백신 완성 및 군사 통제구역 전달</span>
                      <span className="block ml-3 text-xs text-[#c7b8b8]">3. <span className="text-[#38587a]">✈️ 수송기 탈출 엔딩</span>: 공항에서 휘발유 캔과 공학자 동료를 보유한 상태로 경비기 가동</span>
                    </p>
                  </div>
                  <button onClick={startGame} disabled={!player.name} className="w-full bg-[#d84b4b] text-[#0a0505] font-bold py-4 mt-2 tracking-widest disabled:bg-[#2b1b1b] disabled:text-[#4a1c1c] transition-colors">생존 시작</button>
                </div>
              </div>
            );
          }

          if (gameState === 'victory_vaccine') {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-6 font-sans animate-fade-in max-w-2xl mx-auto">
                <h1 className="text-5xl md:text-6xl font-black text-[#5a86b5] mb-2 tracking-widest">인류의 영웅</h1>
                <h2 className="text-xl font-bold text-[#f8f8f2] mb-4">생존자: {player.name}</h2>
                <div className="bg-[#17232e] border-2 border-[#5a86b5] p-5 w-full text-center mb-6 shadow-xl space-y-2">
                  <div className="text-xs font-bold text-[#5a86b5] tracking-wider uppercase">🧪 구원 성공: 백신 전달 완수</div>
                  <p className="text-sm md:text-base text-[#f8f8f2] font-bold italic leading-relaxed break-keep">
                    "반려동물의 고귀한 희생과 당신의 험난한 여정 끝에 마침내 완성된 백신이 군사 통제구역에 전달되었습니다. 인류는 당신 덕분에 멸망을 피했고, 당신은 전설적인 영웅이 되었습니다."
                  </p>
                </div>

                <div className="bg-[#11161a] border border-[#1f2a3a] p-6 text-center text-sm text-[#c7b8b8] space-y-2 w-full mb-4">
                  <h2 className="text-[#5a86b5] font-bold text-lg mb-3">최종 구원 기록</h2>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <p>구원 날짜: {formatTime(counters.totalHours)} ({currentDay}일 차)</p>
                    <p>도착 장소: {LOCATIONS.find(l => l.id === currentLocation)?.name || '알 수 없음'}</p>
                    <p>함께 탈출한 동료: {companions.length}명</p>
                    <p>잔여 물품: {inventory.length}개</p>
                  </div>
                </div>
                
                <div className="w-full bg-[#110b0b] border border-[#3a1f1f] p-4 text-xs h-56 overflow-y-auto custom-scrollbar mb-6 space-y-2 text-left">
                  <h3 className="text-[#2e8b57] font-bold mb-2 border-b border-[#3a1f1f] pb-1">📜 전체 생존 일지 기록</h3>
                  {logs.map((log, idx) => (
                    <div key={idx} className={`flex space-x-2 ${log.type === 'event' ? 'text-[#d84b4b] font-bold' : 'text-[#8f7a7a]'}`}>
                      <span className="shrink-0 text-[10px]">[{log.timeStr}]</span>
                      <span className="leading-relaxed">{log.text}</span>
                    </div>
                  ))}
                </div>

                <button onClick={() => window.location.reload()} className="px-8 py-3 border border-[#5a86b5] text-[#5a86b5] hover:bg-[#5a86b5] hover:text-[#0a0505] transition-colors tracking-widest font-bold">새로운 전설 도전</button>
              </div>
            );
          }
          
          if (gameState === 'ending_betrayal') {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-6 font-sans animate-fade-in max-w-2xl mx-auto">
                <h1 className="text-5xl md:text-6xl font-black text-[#8f7a7a] mb-2 tracking-widest">배신과 고독</h1>
                <h2 className="text-xl font-bold text-[#f8f8f2] mb-4">생존자: {player.name}</h2>
                <div className="bg-[#231717] border-2 border-[#8f7a7a] p-5 w-full text-center mb-6 shadow-xl space-y-2">
                  <div className="text-xs font-bold text-[#8f7a7a] tracking-wider uppercase">배드 엔딩: 버려진 자</div>
                  <p className="text-sm md:text-base text-[#f8f8f2] font-bold italic leading-relaxed break-keep">
                    "구조대가 도착했지만, 그동안의 학대와 배신감에 눈이 먼 동료들이 당신을 버려두고 혼자 탈출 헬기에 탑승합니다. 결국 당신은 무너진 도시에 홀로 남겨집니다."
                  </p>
                </div>
                
                <div className="w-full bg-[#110b0b] border border-[#3a1f1f] p-4 text-xs h-56 overflow-y-auto custom-scrollbar mb-6 space-y-2 text-left">
                  <h3 className="text-[#2e8b57] font-bold mb-2 border-b border-[#3a1f1f] pb-1">📜 전체 생존 일지 기록</h3>
                  {logs.map((log, idx) => (
                    <div key={idx} className={`flex space-x-2 ${log.type === 'event' ? 'text-[#d84b4b] font-bold' : 'text-[#8f7a7a]'}`}>
                      <span className="shrink-0 text-[10px]">[{log.timeStr}]</span>
                      <span className="leading-relaxed">{log.text}</span>
                    </div>
                  ))}
                </div>

                <button onClick={() => window.location.reload()} className="px-8 py-3 border border-[#8f7a7a] text-[#8f7a7a] hover:bg-[#8f7a7a] hover:text-[#0a0505] transition-colors tracking-widest font-bold">다시 시작</button>
              </div>
            );
          }

          if (gameState === 'ending_mutant') {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-6 font-sans animate-fade-in max-w-2xl mx-auto">
                <h1 className="text-5xl md:text-6xl font-black text-[#8b2626] mb-2 tracking-widest">변이체 조종자</h1>
                <h2 className="text-xl font-bold text-[#f8f8f2] mb-4">생존자: {player.name}</h2>

                        {[ { speed: isPlaying ? 0 : 1, label: isPlaying ? '⏸️ 일시정지' : '▶️ 재생' }, { speed: 2, label: '2x' }, { speed: 4, label: '4x' }, { speed: 8, label: '8x' }, { speed: 16, label: '16x' } ].map((btn, idx) => (
                          <button key={idx} onClick={() => { if (idx === 0) { setIsPlaying(!isPlaying); if (!isPlaying && gameSpeed === 0) setGameSpeed(1); } else { setGameSpeed(btn.speed); setIsPlaying(true); } }} className={`px-2 py-0.5 text-[10px] font-bold transition-colors ${(idx === 0 && !isPlaying) || (idx > 0 && gameSpeed === btn.speed && isPlaying) ? 'bg-[#d84b4b] text-[#0a0505]' : 'bg-[#1a1111] text-[#8f7a7a] hover:text-[#f8f8f2]'}`}>
                            {btn.label}
                          </button>
                        ))}
                      </div>
                    </div>
                    <span className="text-[11px] font-bold text-[#8f7a7a] text-right shrink-0">{formatTime(counters.totalHours)}</span>
                  </div>

                  {activeEvent && (
                    <div className="border-b-2 border-[#d84b4b] bg-[#231717] p-5 shadow-[0_4px_15px_rgba(216,75,75,0.15)] animate-fade-in shrink-0 max-h-[360px] overflow-y-auto custom-scrollbar">
                      <p className="text-[#d84b4b] text-[10px] font-bold tracking-widest mb-3 uppercase">{activeEvent.id.includes('travel') ? "이동 이벤트" : "운명의 갈림길"}</p>
                      <p className="text-[15px] text-[#f8f8f2] mb-6 leading-relaxed break-keep">{activeEvent.text}</p>
                      <div className="space-y-2">
                        {activeEvent.choices.map((choice, idx) => (
                          <button key={idx} onClick={() => handleChoice(choice)} className="w-full text-left bg-[#110b0b] border border-[#3a1f1f] text-[#f8f8f2] p-3 text-sm hover:border-[#d84b4b] transition-colors">
                            {choice.text}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div ref={logContainerRef} className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                    {logs.map((log, idx) => (
                      <div key={idx} className={`flex space-x-3 text-sm ${log.type === 'event' ? 'text-[#d84b4b] font-bold' : 'text-[#c7b8b8]'}`}>
                        <div className="shrink-0 w-24 font-bold text-[#8f7a7a] text-[11px] pt-[3px] tracking-widest">[{log.timeStr}]</div>
                        <div className="flex-1 leading-relaxed break-keep whitespace-pre-line">{log.text}</div>
                      </div>
                    ))}
                    <div ref={logEndRef}></div>
                  </div>
                </div>

                <div className="col-span-1 flex flex-col space-y-4 overflow-y-auto custom-scrollbar pr-2">
                  <div className="bg-[#231717] border border-[#3a1f1f] p-4">
                    <h3 className="text-xs font-bold text-[#8f7a7a] mb-4 tracking-widest flex justify-between">
                      <span>소지품</span>
                      <span className={inventory.length >= maxInventorySlots ? "text-[#d84b4b]" : "text-[#8f7a7a]"}>{inventory.length} / {maxInventorySlots}</span>
                    </h3>
                    <div className="grid grid-cols-2 gap-2">
                      {Array.from({ length: maxInventorySlots }).map((_, idx) => {
                        const itemId = inventory[idx];
                        const isWeapon = WEAPONS.includes(itemId);
                        const dur = isWeapon ? (weaponDurability[itemId] !== undefined ? weaponDurability[itemId] : 2) : null;
                        const wRole = isWeapon ? WEAPON_ROLES[itemId] : null;

                        return (
                          <div key={idx} title={wRole ? wRole.desc : ''} className={`flex flex-col items-center justify-center p-3 border text-center h-20 relative ${itemId ? 'bg-[#110b0b] border-[#3a1f1f]' : 'bg-[#110b0b]/40 border-[#221515] text-[#443333]'}`}>
                            {itemId ? (
                              <>
                                <span className="text-2xl mb-1">{getItemVisual(itemId).icon}</span>
                                <span className="text-[11px] font-bold">{getItemVisual(itemId).name}</span>
                                {isWeapon && (
                                  <span className="absolute top-1 right-1 text-[9px] px-1 bg-[#3a1f1f] text-[#d84b4b] border border-[#d84b4b]">
                                    내구: {dur}/2
                                  </span>
                                )}
                              </>
                            ) : (
                              <span className="text-xs italic text-[#443333]">비어있음</span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {(isPlaying || activeEvent) && (
                    <div className="bg-[#231717] border border-[#38587a] p-4 transition-all">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-xs font-bold text-[#38587a] tracking-widest">목적지 이동 (수색)</h3>
                        {activeEvent && <span className="text-[10px] text-[#d84b4b] font-bold animate-pulse">상황 진행 중 (이동 예약 가능)</span>}
                      </div>
                      {counters.hasShelter && <p className="text-xs text-[#d84b4b] mb-3 font-bold">⚠️ 이동 시 은신처를 잃게 됩니다.</p>}
                      <div className="grid grid-cols-1 gap-2 max-h-[220px] overflow-y-auto custom-scrollbar pr-1">
                        {LOCATIONS.map(loc => {
                          const currentLocData = LOCATIONS.find(l => l.id === currentLocation) || LOCATIONS[0];
                          const dist = Math.abs(loc.distance - currentLocData.distance);
                          const isCurrent = currentLocation === loc.id && !travelState;
                          
                          let speedMod = vehicle ? VEHICLE_TYPES[vehicle.id]?.speedMult || 1 : 1;
                          let estTime = Math.max(1, Math.round((1 + dist * 2) * speedMod));

                          return (
                            <button
                              key={loc.id} onClick={() => handleSelectLocation(loc.id)} disabled={isCurrent && !counters.hasShelter}
                              className={`text-left border p-3 text-xs transition-colors ${reservedLocation === loc.id ? 'bg-[#2b3a4a] border-[#5a86b5] text-[#f8f8f2]' : (isCurrent && !counters.hasShelter ? 'bg-[#3a1f1f] border-[#d84b4b] text-[#f8f8f2] cursor-default' : 'bg-[#110b0b] border-[#3a1f1f] text-[#8f7a7a] hover:border-[#38587a] hover:text-[#f8f8f2]')}`}
                            >
                              <div className="font-bold mb-1 flex justify-between">
                                <span>
                                  {loc.name} {isCurrent && !counters.hasShelter ? '(현재 위치)' : ''}
                                  {reservedLocation === loc.id && <span className="ml-2 text-[#5a86b5] animate-pulse">[예약됨]</span>}
                                </span>
                                {!isCurrent && <span className="text-[10px] text-[#38587a]">소요 {estTime}시간</span>}
                              </div>
                              <div className="text-[10px] leading-relaxed break-keep">{loc.desc}</div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {(inventory.includes('medkit') || inventory.includes('ration') || inventory.includes('soap') || inventory.includes('wet_wipes') || inventory.includes('gas_can') || inventory.includes('battery_pack') || inventory.includes('pet_food') || inventory.includes('chocolate') || inventory.includes('coffee') || (inventory.includes('lighter') && inventory.includes('cigarette'))) && (isPlaying || activeEvent) && (
                    <div className="bg-[#231717] border border-[#38587a] p-4 animate-fade-in">
                      <h3 className="text-xs font-bold text-[#38587a] mb-4 tracking-widest">소모품 수동 사용</h3>
                      <div className="space-y-2">
                        {inventory.includes('gas_can') && vehicle && (vehicle.id === 'motorcycle' || vehicle.id === 'car') && (
                          <button onClick={() => handleCraftingUse('refuel_vehicle')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">⛽ 휘발유 주유 (연료 +50%)</button>
                        )}
                        {inventory.includes('battery_pack') && vehicle && vehicle.id === 'kickboard' && (
                          <button onClick={() => handleCraftingUse('charge_kickboard')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🔋 킥보드 충전 (배터리 +40%)</button>
                        )}
                        {inventory.includes('pet_food') && companions.some(c => c.role === '군견' || c.role === '길고양이') && (
                          <button onClick={() => handleCraftingUse('feed_pet')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🥩 반려동물 사료 주기 (애완동물 친밀도 MAX)</button>
                        )}
                        {inventory.includes('chocolate') && <button onClick={() => handleCraftingUse('use_chocolate')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🍫 초콜릿 먹기 (정신력/포만감 회복)</button>}
                        {inventory.includes('coffee') && <button onClick={() => handleCraftingUse('use_coffee')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">☕ 캔커피 마시기 (정신력 회복)</button>}
                        {inventory.includes('soap') && <button onClick={() => handleCraftingUse('use_soap')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🧼 비누 사용</button>}
                        {inventory.includes('wet_wipes') && <button onClick={() => handleCraftingUse('use_wipes')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🧻 물티슈 사용</button>}
                        {inventory.includes('lighter') && inventory.includes('cigarette') && <button onClick={() => handleCraftingUse('smoke')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🚬 담배 피우기</button>}
                        {inventory.includes('medkit') && <button onClick={() => handleCraftingUse('heal')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🚑 구급상자 사용</button>}
                        {inventory.includes('ration') && <button onClick={() => handleCraftingUse('eat_ration')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🥫 전투식량 섭취 (동료 충성도/호감도↑)</button>}
                      </div>
                    </div>
                  )}
                </div>

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SurvivalGame />);
    </script>
</body>
</html>
