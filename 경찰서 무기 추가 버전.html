<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생존왕 THE ZOMBIE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            margin: 0; 
            background-color: #0a0505; 
            color: #f8f8f2; 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #110b0b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3a1f1f; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d84b4b; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MAX_LOGS = 200;
        const BASE_INVENTORY_SIZE = 5;

        const NORMAL_LOGS = {
          sheltered: [
            "천장에서 새는 물을 빈 깡통으로 받쳐둡니다.",
            "가방을 열어 물건들을 정돈하며 마음을 다잡습니다.",
            "은신처를 보수하며 빈틈이 없는지 안전을 재확인합니다.",
            "창밖을 내다보며 멀리 지나가는 감염자들의 무리를 관찰합니다."
          ],
          unsheltered: [
            "버려진 차량 밑에 숨어 감염자들을 피합니다.",
            "발소리를 죽이며 골목길을 이동합니다.",
            "안전한 곳을 찾기 위해 쓰레기통을 뒤집니다.",
            "어둠 속에서 익숙하지 않은 부스럭거리는 소리가 들려 긴장합니다."
          ]
        };

        const LOCATIONS = [
          { id: 'street', name: '도심 거리', desc: '위험성이 적당하며 생존자를 마주칠 확률이 있습니다.', distance: 0 },
          { id: 'police_station', name: '관할 경찰서', desc: '총기 및 탄약, 경찰용 장비를 수색할 수 있지만 감염된 경찰관들이 배회합니다.', distance: 3 },
          { id: 'gas_station', name: '폐주유소', desc: '기름과 차 부품을 구하기 용이하지만 유독가스와 화재 위험이 있습니다.', distance: 2 },
          { id: 'hospital', name: '폐병원', desc: '의약품을 찾기 용이하지만 감염자 위험이 큽니다.', distance: 3 },
          { id: 'mart', name: '대형 마트', desc: '식량이 풍부하지만 약탈자와의 분쟁이 잦습니다.', distance: 2 },
          { id: 'military', name: '군부대 진지', desc: '강력한 무기를 얻을 수 있으나 무장한 군인 감염자가 출몰합니다.', distance: 5 },
          { id: 'subway', name: '지하철역', desc: '어둡고 밀폐되어 멘탈 소모가 크지만 은신처를 발견할 수 있습니다.', distance: 4 },
          { id: 'highway', name: '외곽 고속도로', desc: '버려진 자동차가 길을 막고 있지만 멀리 이동하기 적합합니다.', distance: 6 },
          { id: 'school', name: '버려진 초등학교', desc: '보건실과 급식실에서 생존 물품을 찾을 수 있습니다.', distance: 3 },
          { id: 'broadcasting', name: '폐방송국', desc: '통신 장비 및 고가치가 있는 소모품을 수색할 수 있습니다.', distance: 4 },
          { id: 'port', name: '항구 물류창고', desc: '컨테이너 속 유용한 대량의 보급품이 잠들어 있습니다.', distance: 7 }
        ];

        const RESPAWN_LOCATIONS = [
          { id: 'home', name: '아파트 은신처', hasShelter: true, log: "익숙한 아파트 침대 위에서 눈을 떴습니다. 당장은 안전합니다." },
          { id: 'alley', name: '피빛 골목길', hasShelter: false, log: "피와 악취가 진동하는 골목길 구석에서 정신을 차렸습니다." },
          { id: 'subway_tunnel', name: '지하철 선로 통로', hasShelter: false, log: "어두컴컴한 지하철 선로 한복판에서 눈을 떴습니다." },
          { id: 'highway', name: '버려진 고속도로', hasShelter: false, log: "뒤얽힌 고속도로 차 안에서 깨어났습니다." }
        ];

        const TRAITS_POOL = [
          { id: 'strong', name: '💪 강인한 신체', desc: '최대 건강 120' },
          { id: 'calm', name: '🧠 냉철한 정신', desc: '정신력 감소 속도 50% 완화' },
          { id: 'eagle_eye', name: '🦅 매의 눈', desc: '파밍 시 추가 이득 보너스' },
          { id: 'clean_freak', name: '🧼 결벽증', desc: '위생 상태가 좋을 때 정신력 추가 회복' }
        ];

        const START_ITEMS_POOL = ['bat', 'medkit', 'ration', 'soju', 'soap', 'wet_wipes', 'radio', 'gas_can', 'pet_food', 'chocolate', 'coffee', 'machete'];

        const VEHICLE_TYPES = {
          bicycle: { name: '🚲 자전거', speedMult: 0.5, type: 'stamina', costPerDist: 8, desc: '기름이 필요 없지만 허기와 체력을 추가 소모합니다.' },
          kickboard: { name: '🛴 전동 킥보드', speedMult: 0.4, type: 'battery', maxCap: 100, costPerDist: 20, desc: '빠르고 조용하지만 배터리가 소모됩니다.' },
          motorcycle: { name: '🏍️ 오토바이', speedMult: 0.3, type: 'fuel', maxCap: 100, costPerDist: 15, desc: '기능이 뛰어나며 기름을 사용합니다.' },
          car: { name: '🚗 SUV 자동차', speedMult: 0.25, type: 'fuel', maxCap: 100, costPerDist: 25, desc: '안전하고 대량 파밍 가능. 기름 소모가 큰 편입니다.' }
        };

        const EVENTS = [
          {
            id: 'forced_relocation',
            condition: (state) => state.counters.locationHours >= 72,
            text: "[위험 경고] 이 구역에 너무 오래 머물렀습니다. 당신의 체취와 소음을 추적한 거대한 감염자 무리(호드)가 몰려오고 있습니다! 당장 이곳을 떠나야 합니다.",
            choices: [
              {
                text: "가장 가까운 다른 구역으로 도망친다.",
                action: (inv, counters, trait, companions, vehicle, currentLocation) => {
                  const availableLocs = LOCATIONS.filter(l => l.id !== currentLocation);
                  const randomLoc = availableLocs[Math.floor(Math.random() * availableLocs.length)];
                  return { stats: { health: -10, mental: -20 }, flags: { arrived: randomLoc.id }, log: `좀비 떼에 쫓겨 급하게 [${randomLoc.name}](으)로 도망쳤습니다!` };
                }
              },
              {
                text: "물자를 챙기느라 지연된 후 도망친다 (부상 위험).",
                action: (inv, counters, trait, companions, vehicle, currentLocation) => {
                  const availableLocs = LOCATIONS.filter(l => l.id !== currentLocation);
                  const randomLoc = availableLocs[Math.floor(Math.random() * availableLocs.length)];
                  return { stats: { health: -30, mental: -15 }, itemsGained: ['ration', 'medkit'], flags: { arrived: randomLoc.id }, log: `물자를 챙기다 큰 부상을 입고 [${randomLoc.name}](으)로 겨우 도망쳤습니다.` };
                }
              }
            ]
          },
          // === 생존 일수 비례 좀비 / 특수 좀비 습격 이벤트 ===
          {
            id: 'zombie_horde_attack',
            condition: (state) => {
              const days = Math.floor(state.counters.totalHours / 24);
              const chance = Math.min(0.8, 0.15 + days * 0.08); 
              return Math.random() < chance;
            },
            text: "[습격] 주변에서 갑자기 좀비 무리가 들이닥쳤습니다!",
            choices: [
              {
                text: "무기를 휘두르며 맞서 싸운다.",
                action: (inv) => {
                  if (inv.includes('shotgun')) {
                    return { stats: { health: 0, mental: +5 }, log: "💥 샷건을 발사하여 좀비 무리를 일격에 소탕했습니다!" };
                  }
                  if (inv.includes('pistol')) {
                    return { stats: { health: -5, mental: 0 }, log: "🔫 권총 사격으로 접근하는 좀비들을 신속히 처치했습니다." };
                  }
                  if (inv.includes('machete') || inv.includes('bat') || inv.includes('baton') || inv.includes('knife')) {
                    return { stats: { health: -10, mental: -5 }, log: "근접 무기를 활용해 좀비 무리를 기어코 퇴치했습니다." };
                  }
                  return { stats: { health: -25, mental: -15 }, log: "맨손으로 싸우다 호되게 물리고 다쳤습니다." };
                }
              },
              {
                text: "재빨리 주변 장애물 뒤로 숨는다.",
                action: () => {
                  if (Math.random() < 0.5) return { stats: { mental: -10 }, log: "숨을 죽이고 긴 기다림 끝에 좀비들을 보냈습니다." };
                  return { stats: { health: -20, mental: -20 }, log: "발각되어 기습당했습니다!" };
                }
              }
            ]
          },
          {
            id: 'special_zombie_ambush',
            condition: (state) => {
              const days = Math.floor(state.counters.totalHours / 24);
              if (days < 2) return false; 
              const chance = Math.min(0.6, 0.1 + (days - 1) * 0.07);
              return Math.random() < chance;
            },
            text: "[특수 좀비 출몰] 괴이하게 변이된 대형 특수 좀비가 포효하며 돌진해옵니다!",
            choices: [
              {
                text: "무기로 약점을 공략한다.",
                action: (inv) => {
                  if (inv.includes('shotgun') || inv.includes('pistol')) {
                    return { stats: { health: -5, mental: +5 }, itemsGained: ['medkit'], log: "화기로 변이체의 급소를 제압하고 전리품을 챙겼습니다!" };
                  }
                  if (inv.includes('machete') || inv.includes('knife') || inv.includes('baton')) {
                    return { stats: { health: -15, mental: -10 }, itemsGained: ['medkit'], log: "급소를 질러 특수 좀비를 처치하고 전리품을 챙겼습니다!" };
                  }
                  return { stats: { health: -35, mental: -20 }, log: "강력한 힘에 밀려 심각한 타격을 입었습니다." };
                }
              },
              {
                text: "소지품이나 식량을 던져 시선을 분산시키고 도망친다.",
                action: (inv) => {
                  if (inv.includes('ration')) {
                    return { itemsLost: ['ration'], log: "전투식량을 던져 놈이 멈칫한 틈에 무사히 도망쳤습니다." };
                  }
                  return { stats: { health: -30, mental: -15 }, log: "던질 만한 물건이 없어 도망치다 매섭게 공격당했습니다." };
                }
              }
            ]
          },

          // === [신규 장소 시나리오: 관할 경찰서] ===
          {
            id: 'police_armory',
            condition: (state) => state.currentLocation === 'police_station',
            text: "[장소 시나리오: 관할 경찰서] 철제로 이중 잠금 처리된 경찰서 지하 무기고 입구를 발견했습니다.",
            choices: [
              {
                text: "도구를 사용해 강제로 무기고 문을 개척한다.",
                action: (inv) => {
                  if (inv.includes('machete') || inv.includes('knife') || inv.includes('baton') || inv.includes('bat')) {
                    const gainedWeapon = Math.random() < 0.4 ? 'shotgun' : 'pistol';
                    return { itemsGained: [gainedWeapon], log: `무기고를 강제로 개척하여 [${gainedWeapon === 'shotgun' ? '샷건' : '권총'}]을 획득했습니다!` };
                  }
                  return { stats: { health: -10 }, log: "적절한 도구가 없어 손만 베이고 문을 열지 못했습니다." };
                }
              },
              {
                text: "주변 데스크와 서랍에서 비상 열쇠를 탐색한다.",
                action: () => {
                  if (Math.random() < 0.35) return { itemsGained: ['pistol'], log: "서랍 안쪽 비밀 수납함에서 38구경 권총을 발견했습니다!" };
                  return { stats: { mental: -5 }, log: "열쇠를 찾지 못하고 시간만 허비했습니다." };
                }
              },
              { text: "소음 발생이 우려되어 그냥 지나친다.", action: () => ({ log: "무기고를 뒤로하고 복도를 벗어났습니다." }) }
            ]
          },
          {
            id: 'police_evidence_room',
            condition: (state) => state.currentLocation === 'police_station',
            text: "[장소 시나리오: 관할 경찰서] 봉인 테이프가 찢겨 있는 증거물 보관실 문이 살짝 열려 있습니다.",
            choices: [
              {
                text: "내부 증거물 선반을 수색한다.",
                action: () => {
                  const rand = Math.random();
                  if (rand < 0.3) return { itemsGained: ['machete'], log: "증거물 상자 속에서 날카로운 마체테를 발견했습니다!" };
                  if (rand < 0.6) return { itemsGained: ['baton', 'wet_wipes'], log: "진압봉과 위생용 물티슈를 챙겼습니다." };
                  return { stats: { health: -15 }, log: "어둠 속에서 잠복해 있던 감염된 경찰관의 기습을 받았습니다!" };
                }
              },
              { text: "위험을 느껴 방을 지나친다.", action: () => ({ log: "증거물 보관실을 우회하여 이동했습니다." }) }
            ]
          },

          // === 장소 별 특별 시나리오 ===
          // 1. 도심 거리 (street)
          {
            id: 'street_broken_atm',
            condition: (state) => state.currentLocation === 'street',
            text: "[장소 시나리오: 도심 거리] 파손된 자판기와 부서진 ATM이 길가에 방치되어 있습니다.",
            choices: [
              {
                text: "자판기 내부를 도구로 털어본다.",
                action: (inv) => {
                  if (inv.includes('machete') || inv.includes('knife') || inv.includes('baton') || inv.includes('bat')) {
                    return { itemsGained: ['chocolate', 'coffee'], log: "자판기를 부수고 초콜릿과 캔커피를 찾아냈습니다!" };
                  }
                  return { stats: { hunger: -10 }, log: "도구가 없어 힘만 빼고 수확이 없었습니다." };
                }
              },
              { text: "그냥 지난친다.", action: () => ({ log: "거리를 계속 이동합니다." }) }
            ]
          },
          {
            id: 'street_barricade',
            condition: (state) => state.currentLocation === 'street',
            text: "[장소 시나리오: 도심 거리] 방치된 바리케이드와 경찰 차량 잔해가 길을 막고 있습니다.",
            choices: [
              {
                text: "경찰차 내부를 수색한다.",
                action: () => {
                  const rand = Math.random();
                  if (rand < 0.35) return { itemsGained: ['baton'], log: "경찰차 좌석 밑에서 진압봉을 구했습니다!" };
                  if (rand < 0.50) return { itemsGained: ['pistol'], log: "글로브 박스 깊은 곳에서 [권총]을 찾아냈습니다!" };
                  return { stats: { health: -10 }, log: "깨진 유리창에 베여 상처를 입었습니다." };
                }
              },
              { text: "바리케이드를 우회한다.", action: () => ({ log: "조심스럽게 바리케이드를 돌아서 넘어갔습니다." }) }
            ]
          },
          // 2. 폐주유소 (gas_station)
          {
            id: 'gas_station_scavenge',
            condition: (state) => state.currentLocation === 'gas_station',
            text: "[장소 시나리오: 폐주유소] 주유소 정비소 문이 단단히 잠겨 있습니다. 내부엔 기름통과 유용한 도구가 보입니다.",
            choices: [
              {
                text: "유리창을 깨고 진입한다.",
                action: () => {
                  if (Math.random() < 0.5) return { itemsGained: ['gas_can', 'pet_food'], stats: { mental: +5 }, log: "유리창을 깨고 들어가 휘발유와 반려동물 사료를 챙겼습니다!" };
                  return { stats: { health: -15 }, log: "유리 조각에 다치고 좀비 소음 어그로를 끌었습니다." };
                }
              },
              {
                text: "도구(마체테/단검/배트)로 잠금장치를 강제로 비틀어 연다.",
                action: (inv) => {
                  if (inv.includes('machete') || inv.includes('knife') || inv.includes('bat')) return { itemsGained: ['gas_can'], log: "성공적으로 정비소 문을 따고 [휘발유 캔]을 구했습니다." };
                  return { stats: { hunger: -15 }, log: "도구가 없어 힘만 쏟고 실패했습니다." };
                }
              },
              { text: "위험하니 그냥 돌아선다.", action: () => ({ log: "주유소를 뒤로하고 떠났습니다." }) }
            ]
          },
          {
            id: 'gas_station_tanker',
            condition: (state) => state.currentLocation === 'gas_station',
            text: "[장소 시나리오: 폐주유소] 방치된 유류 수송 탱크로리 차량이 누출 가스를 풍기며 멈춰 서 있습니다.",
            choices: [
              {
                text: "호스를 연결해 남은 기름을 수거한다.",
                action: () => {
                  if (Math.random() < 0.5) return { itemsGained: ['gas_can'], log: "탱크 하부에서 유용한 [휘발유 캔]을 추출했습니다!" };
                  return { stats: { health: -15, hygiene: -20 }, log: "유독 가스를 마시고 기름을 뒤집어썼습니다." };
                }
              },
              { text: "폭발 위험이 있으니 멀어진다.", action: () => ({ log: "탱크로리를 피해 멀찍이 이동했습니다." }) }
            ]
          },
          {

                      addCompanion: { id: 'engineer', role: '공학자', name: '정공학', desc: '🔧 위생 및 은신처 관리 가속', loyalty: 70, affinity: 60 },
                      log: "정공학이 동료로 합류했습니다! (패시브: 위생 감소 방지)"
                    };
                  }
                  return { stats: { mental: -5 }, log: "기호품이 없어 그를 설득하지 못했습니다." };
                }
              },
              {
                text: "발전기를 고치면 보호해주겠다고 제안한다.",
                action: () => {
                  if(Math.random() < 0.5) return { addCompanion: { id: 'engineer', role: '공학자', name: '정공학', desc: '🔧 위생 및 은신처 관리 가속', loyalty: 50, affinity: 40 }, log: "어쩔 수 없다는 듯 정공학이 마지못해 합류했습니다." };
                  return { log: "정공학은 당신을 믿지 못하겠다며 거절했습니다." };
                }
              },
              { text: "지나친다.", action: () => ({ log: "그를 두고 지나쳤습니다." }) }
            ]
          },
          {
            id: 'companion_betrayal',
            condition: (state) => state.companions.some(c => c.loyalty <= 35) || (state.companions.length > 0 && (state.stats.hunger <= 35 || state.stats.mental <= 25)),
            text: "[충성도 균열] 불만에 찬 동료가 배고픔과 공포를 견디지 못하고 배신을 획책하고 있습니다!",
            choices: [
              {
                text: "무기로 위협하여 쫓아낸다.",
                action: (inv, counters, trait, companions) => {
                  const betrayer = companions.find(c => c.loyalty <= 35) || companions[0];
                  if (inv.includes('shotgun') || inv.includes('pistol') || inv.includes('machete') || inv.includes('bat') || inv.includes('knife') || inv.includes('baton')) {
                    return { removeCompanionId: betrayer.id, stats: { mental: -15 }, log: `무기로 억제하여 소지품을 지켰습니다. [${betrayer.name}]은(는) 떠났습니다.` };
                  }
                  const stolenItem = inv.length > 0 ? inv[0] : null;
                  return { removeCompanionId: betrayer.id, itemsLost: stolenItem ? [stolenItem] : [], stats: { mental: -25 }, log: `무기가 없어 저지하지 못했습니다! [${betrayer.name}]이(가) 소지품을 훔쳐 도망쳤습니다.` };
                }
              },
              {
                text: "전투식량을 내어주며 다독인다.",
                action: (inv, counters, trait, companions) => {
                  const betrayer = companions.find(c => c.loyalty <= 35) || companions[0];
                  if (inv.includes('ration')) {
                    return { itemsLost: ['ration'], updateLoyalty: { id: betrayer.id, delta: +30 }, updateAffinity: { id: betrayer.id, delta: +10 }, stats: { mental: +15 }, log: `식량을 건네자 [${betrayer.name}]의 충성도가 크게 상승했습니다!` };
                  }
                  return { removeCompanionId: betrayer.id, stats: { mental: -20 }, log: "나눠줄 식량이 없어 동료가 결국 도망치고 말았습니다." };
                }
              },
              {
                text: "그동안 쌓아온 정에 호소하며 설득한다 (호감도 60 이상 필요).",
                action: (inv, counters, trait, companions) => {
                  const betrayer = companions.find(c => c.loyalty <= 35) || companions[0];
                  if (betrayer.affinity >= 60) {
                    return { updateLoyalty: { id: betrayer.id, delta: +40 }, updateAffinity: { id: betrayer.id, delta: +15 }, log: `[${betrayer.name}]은(는) 당신의 진심 어린 호소에 마음을 돌렸습니다! (충성도 회복)` };
                  }
                  return { removeCompanionId: betrayer.id, stats: { health: -10, mental: -30 }, log: `호감도가 부족하여 설득에 실패했습니다. 오히려 그가 당신을 밀치고 도망쳤습니다.` };
                }
              },
              {
                text: "배신하기 전에 먼저 기습하여 제압한다.",
                action: (inv, counters, trait, companions) => {
                  const betrayer = companions.find(c => c.loyalty <= 35) || companions[0];
                  return { removeCompanionId: betrayer.id, itemsGained: ['ration'], stats: { mental: -40 }, log: `동료를 선제 공격하여 식량을 빼앗고 쫓아냈습니다. 깊은 죄책감에 시달립니다.` };
                }
              }
            ]
          }
        ];

        function SurvivalGame() {
          const [gameState, setGameState] = useState('opening'); 
          const [player, setPlayer] = useState({ name: "", gender: "남성" });
          const [trait, setTrait] = useState(null);
          const [inventory, setInventory] = useState([]);
          const [companions, setCompanions] = useState([]);
          const [currentLocation, setCurrentLocation] = useState('street');
          const [stats, setStats] = useState({ health: 100, hunger: 100, mental: 100, hygiene: 100 });
          const [counters, setCounters] = useState({ totalHours: 8, zombiesKilled: 0, hasShelter: false }); 
          const [flags, setFlags] = useState({});
          const [isPlaying, setIsPlaying] = useState(false);
          const [gameSpeed, setGameSpeed] = useState(1);
          const [logs, setLogs] = useState([]); 
          const [activeEvent, setActiveEvent] = useState(null);
          const [recentEventIds, setRecentEventIds] = useState([]);
          const [reservedLocation, setReservedLocation] = useState(null);
          const [vehicle, setVehicle] = useState(null);

          // === [아이템 초과 Discard 모달 상태] ===
          const [discardModal, setDiscardModal] = useState({ open: false, pendingItems: [] });

          const logEndRef = useRef(null);
          const logContainerRef = useRef(null);

          const maxInventorySlots = BASE_INVENTORY_SIZE + (companions.some(c => c.id === 'nurse') ? 1 : 0);

          const formatTime = (totalH) => {
            const day = Math.floor(totalH / 24) + 1;
            const hour = totalH % 24;
            return `D-${day} ${hour.toString().padStart(2, '0')}:00`;
          };

          const startGame = () => {
            const spawnPoint = RESPAWN_LOCATIONS[Math.floor(Math.random() * RESPAWN_LOCATIONS.length)];
            const assignedTrait = TRAITS_POOL[Math.floor(Math.random() * TRAITS_POOL.length)];
            const randomItem = START_ITEMS_POOL[Math.floor(Math.random() * START_ITEMS_POOL.length)];
            const maxHealth = assignedTrait.id === 'strong' ? 120 : 100;

            setTrait(assignedTrait);
            setCounters({ totalHours: 8, zombiesKilled: 0, hasShelter: spawnPoint.hasShelter, locationHours: 0 });
            setStats({ health: maxHealth, hunger: 100, mental: 100, hygiene: 100 });
            setFlags({});
            setCompanions([]);
            setInventory([randomItem]);
            setRecentEventIds([]);
            setReservedLocation(null);
            setVehicle(null);
            setCurrentLocation(spawnPoint.id === 'home' ? 'street' : spawnPoint.id);

            setLogs([
              { timeStr: formatTime(8), text: `[성별: ${player.gender}] 특성 [${assignedTrait.name}]을(를) 가지고 생존을 시작합니다.`, type: 'event' },
              { timeStr: formatTime(8), text: spawnPoint.log, type: 'normal' }
            ]);
            setGameState('playing');
            setIsPlaying(true);
          };

          const applyCompanionAndTraitEffects = (currentStats) => {
            let healthGain = 0;
            let hungerExtraLoss = companions.filter(c => c.role !== '길고양이' && c.role !== '군견').length * 1; 
            let mentalGain = 0;

            if (companions.some(c => c.id === 'nurse')) healthGain += 4;
            if (companions.some(c => c.id === 'stray_cat')) mentalGain += 3;
            if (trait?.id === 'clean_freak' && currentStats.hygiene >= 80) mentalGain += 3;
            
            const highAffinityCount = companions.filter(c => c.affinity >= 80).length;
            mentalGain += (highAffinityCount * 2);

            const maxHealth = trait?.id === 'strong' ? 120 : 100;
            return {
              ...currentStats,
              health: Math.min(maxHealth, currentStats.health + healthGain),
              hunger: Math.max(0, currentStats.hunger - hungerExtraLoss),
              mental: Math.min(100, currentStats.mental + mentalGain)
            };
          };

          // ==================== [자동 아이템 사용 오토 비상 로직] ====================
          useEffect(() => {
            if (gameState !== 'playing') return;

            const maxHealth = trait?.id === 'strong' ? 120 : 100;

            // 1. 건강 10% 미만 -> 구급상자 자동 사용
            if (stats.health < maxHealth * 0.10 && inventory.includes('medkit')) {
              handleCraftingUse('heal');
              setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 건강 위험(10% 미만)! [구급상자]를 자동으로 사용했습니다.", type: 'event' }].slice(-MAX_LOGS));
            }

            // 2. 포만감 10% 미만 -> 전투식량 자동 사용
            if (stats.hunger < 10 && inventory.includes('ration')) {
              handleCraftingUse('eat_ration');
              setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 허기 위험(10% 미만)! [전투식량]을 자동으로 섭취했습니다.", type: 'event' }].slice(-MAX_LOGS));
            }

            // 3. 정신력 10% 미만 -> 정신력 회복 아이템 자동 사용
            if (stats.mental < 10) {
              if (inventory.includes('chocolate')) {
                handleCraftingUse('use_chocolate');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 정신력 위험(10% 미만)! [초콜릿]을 자동으로 먹었습니다.", type: 'event' }].slice(-MAX_LOGS));
              } else if (inventory.includes('coffee')) {
                handleCraftingUse('use_coffee');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 정신력 위험(10% 미만)! [캔커피]를 자동으로 마셨습니다.", type: 'event' }].slice(-MAX_LOGS));
              } else if (inventory.includes('lighter') && inventory.includes('cigarette')) {
                handleCraftingUse('smoke');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 정신력 위험(10% 미만)! [담배]를 자동으로 피웠습니다.", type: 'event' }].slice(-MAX_LOGS));
              }
            }

            // 4. 위생 10% 미만 -> 위생용품 자동 사용
            if (stats.hygiene < 10) {
              if (inventory.includes('soap')) {
                handleCraftingUse('use_soap');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 위생 위험(10% 미만)! [비누]를 자동으로 사용했습니다.", type: 'event' }].slice(-MAX_LOGS));
              } else if (inventory.includes('wet_wipes')) {
                handleCraftingUse('use_wipes');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 위생 위험(10% 미만)! [물티슈]를 자동으로 사용했습니다.", type: 'event' }].slice(-MAX_LOGS));
              }
            }

            // 5. 운송수단 게이지 10% 미만 -> 주유/충전 자동 사용
            if (vehicle && VEHICLE_TYPES[vehicle.id]?.type !== 'stamina' && vehicle.cap < 10) {
              if ((vehicle.id === 'motorcycle' || vehicle.id === 'car') && inventory.includes('gas_can')) {
                handleCraftingUse('refuel_vehicle');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 차량 연료 부족(10% 미만)! [휘발유 캔]을 자동으로 주유했습니다.", type: 'event' }].slice(-MAX_LOGS));
              } else if (vehicle.id === 'kickboard' && inventory.includes('battery_pack')) {
                handleCraftingUse('charge_kickboard');
                setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: "⚠️ [자동 사용] 킥보드 배터리 부족(10% 미만)! [휴대용 배터리]를 자동으로 충전했습니다.", type: 'event' }].slice(-MAX_LOGS));
              }
            }
          }, [stats, vehicle, inventory, gameState, counters.totalHours, trait]);

          useEffect(() => {
            if (!isPlaying || gameState !== 'playing' || gameSpeed === 0 || activeEvent || discardModal.open) return;

            const intervalTime = 2500 / gameSpeed;

            const timer = setInterval(() => {
              const hoursPassed = Math.floor(Math.random() * 2) + 1;
              const newHours = counters.totalHours + hoursPassed;
              const daysSurvived = Math.floor(newHours / 24);
              const difficultyMultiplier = 1 + (daysSurvived * 0.08);

              const chefMultiplier = companions.some(c => c.id === 'chef') ? 0.6 : 1.0;
              const isPharmacistActive = companions.some(c => c.id === 'pharmacist');
              const baseHealthDecayRate = (stats.hygiene < 20 && !isPharmacistActive ? 4 : (counters.hasShelter ? 1 : 2));
              const engineerHygieneMod = companions.some(c => c.id === 'engineer') ? 0.7 : 1.0;

              const healthDecay = baseHealthDecayRate * difficultyMultiplier;
              const hungerDecay = 3 * difficultyMultiplier * chefMultiplier;
              const mentalDecayRate = trait?.id === 'calm' ? 0.5 : 1;
              const mentalDecay = ((counters.hasShelter ? 1 : 3) * mentalDecayRate) * difficultyMultiplier;
              const hygieneDecay = (counters.hasShelter ? 2 : 4) * difficultyMultiplier * engineerHygieneMod;

              let nextStats = {
                health: Math.max(0, stats.health - healthDecay),
                hunger: Math.max(0, stats.hunger - hungerDecay),
                mental: Math.max(0, stats.mental - mentalDecay),
                hygiene: Math.max(0, stats.hygiene - hygieneDecay)
              };

              if (nextStats.hunger < 30) nextStats.health = Math.max(0, nextStats.health - 2 * difficultyMultiplier);
              if (nextStats.hygiene < 30 && !isPharmacistActive) nextStats.mental = Math.max(0, nextStats.mental - 2 * difficultyMultiplier);
              if (nextStats.mental < 30) nextStats.hunger = Math.max(0, nextStats.hunger - 1 * difficultyMultiplier);
              if (nextStats.hunger >= 80 && nextStats.hygiene >= 80) nextStats.mental = Math.min(100, nextStats.mental + 1);
              
              nextStats = applyCompanionAndTraitEffects(nextStats);

              setCompanions(prevComps => prevComps.map(c => {
                let loyaltyLoss = 1;
                let affinityLoss = 0;
                if (nextStats.hunger <= 30) { loyaltyLoss += 2; affinityLoss += 1; }
                if (nextStats.hygiene <= 20) loyaltyLoss += 1;
                return { 
                  ...c, 
                  loyalty: Math.max(0, c.loyalty - loyaltyLoss),
                  affinity: Math.max(0, c.affinity - affinityLoss)
                };
              }));

              if (nextStats.health <= 0 || nextStats.hunger <= 0 || nextStats.mental <= 0) {
                setStats(nextStats);
                setIsPlaying(false);
                setTimeout(() => setGameState('gameover'), 800);
                return;
              }

              const stateForCondition = {
                locationHours: counters.locationHours || 0,
                player, trait, stats: nextStats, counters: { ...counters, totalHours: newHours },
                flags, inventory, companions, currentLocation, vehicle
              };

              const validEvents = EVENTS.filter(e => e.condition(stateForCondition) && !recentEventIds.includes(e.id));
              const triggerRandom = Math.random() < 0.7; // 이벤트 확률 약간 낮춤

              if (validEvents.length > 0 && triggerRandom) {
                const chosenEvent = validEvents[Math.floor(Math.random() * validEvents.length)];
                setRecentEventIds(prev => [...prev.slice(-4), chosenEvent.id]);
                setStats(nextStats);
                setCounters(c => ({ ...c, totalHours: newHours, locationHours: (c.locationHours || 0) + hoursPassed }));
                setActiveEvent(chosenEvent);
                setIsPlaying(false);
                return;
              }

              const logsArray = counters.hasShelter ? NORMAL_LOGS.sheltered : NORMAL_LOGS.unsheltered;
              let randomLog = logsArray[Math.floor(Math.random() * logsArray.length)];
              
              // === [쓰레기통 탐색 확률 보상 업그레이드 - 확률 0.08로 축소] ===
              if (!counters.hasShelter && randomLog.includes("쓰레기통을 뒤집니다")) {
                if (Math.random() < 0.08) { 
                  const trashPool = ['wet_wipes', 'soap', 'chocolate', 'battery_pack'];
                  const foundItem = trashPool[Math.floor(Math.random() * trashPool.length)];
                  const foundItemName = getItemVisual(foundItem).name;
                  randomLog = `쓰레기통을 뒤지던 중 유용한 [${foundItemName}]을(를) 발견하여 챙겼습니다!`;
                  
                  if (inventory.length < maxInventorySlots) {
                    setInventory(inv => [...inv, foundItem]);
                  } else {
                    setIsPlaying(false);
                    setDiscardModal({ open: true, pendingItems: [foundItem] });
                  }
                }
              }

              setStats(nextStats);
              setCounters(c => ({ ...c, totalHours: newHours, locationHours: (c.locationHours || 0) + hoursPassed }));
              setLogs(l => [...l, { timeStr: formatTime(newHours), text: randomLog, type: 'normal' }].slice(-MAX_LOGS));
              
            }, intervalTime);

            return () => clearInterval(timer);
          }, [isPlaying, gameState, gameSpeed, player, trait, stats, counters, flags, inventory, companions, currentLocation, recentEventIds, activeEvent, vehicle, discardModal]);

          useEffect(() => {
            if (logContainerRef.current) logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
          }, [logs, activeEvent]);

          const handleChoice = (choice) => {
            const result = choice.action(inventory, counters, trait, companions, vehicle, currentLocation);
            const maxHealth = trait?.id === 'strong' ? 120 : 100;
            
            let logStr = result.log || "";

            if (result.setVehicle !== undefined) {
              setVehicle(result.setVehicle);
            }

            setStats(prev => {
              let healthDelta = result.stats?.health || 0;
              
              if (healthDelta < 0 && companions.some(c => c.id === 'military_dog')) {
                healthDelta = Math.round(healthDelta * 0.6);
                logStr = `🐕 [군견 '체포'] 군견이 좀비를 막아서며 피해를 줄였습니다!\n` + logStr;
              }

              if (healthDelta < 0 && companions.some(c => c.id === 'soldier')) healthDelta = Math.round(healthDelta * 0.5);
              if (healthDelta < 0 && companions.some(c => c.id === 'police')) {
                healthDelta = Math.round(healthDelta * 0.4);
                logStr = `👮 [경찰관 '최경위'] 최경위가 방패막이가 되어 피해를 대폭 줄였습니다!\n` + logStr;
              }

              if (healthDelta < -15 && companions.some(c => c.affinity >= 80)) {
                if(Math.random() < 0.48) {
                  healthDelta = Math.round(healthDelta * 0.5);
                  logStr = `💖 [협동] 호감도 높은 동료가 위험을 막아 피해를 줄였습니다!\n` + logStr;
                }
              }

              const newStats = {
                health: Math.min(maxHealth, Math.max(0, prev.health + healthDelta)),
                hunger: Math.min(100, Math.max(0, prev.hunger + (result.stats?.hunger || 0))),
                mental: Math.min(100, Math.max(0, prev.mental + (result.stats?.mental || 0))),
                hygiene: Math.min(100, Math.max(0, prev.hygiene + (result.stats?.hygiene || 0)))
              };
              if (newStats.health <= 0 || newStats.hunger <= 0 || newStats.mental <= 0) {
                setIsPlaying(false);
                setTimeout(() => setGameState('gameover'), 800);
              }
              return newStats;
            });

            if (result.flags && result.flags.arrived) {
              const locId = result.flags.arrived;
              setCurrentLocation(locId);
              setCounters(prev => ({ ...prev, hasShelter: false }));
              
              let travelTime = activeEvent.baseTravelTime || 2;
              if (result.travelTimeMod) travelTime = Math.round(travelTime * result.travelTimeMod);
              
              setCounters(prev => ({ ...prev, totalHours: prev.totalHours + travelTime, locationHours: 0 }));
              const targetName = LOCATIONS.find(l => l.id === locId)?.name;
              logStr = `[목적지 도착] ${targetName}에 진입했습니다. (${travelTime}시간 경과) ` + logStr;
              
              delete result.flags.arrived;
            }

            if (result.flags) setFlags(prev => ({ ...prev, ...result.flags }));

            if (result.updateLoyalty || result.updateAffinity) {
              setCompanions(prev => prev.map(c => {
                let newC = { ...c };
                if (result.updateLoyalty && c.id === result.updateLoyalty.id) newC.loyalty = Math.min(100, Math.max(0, newC.loyalty + result.updateLoyalty.delta));
                if (result.updateAffinity && c.id === result.updateAffinity.id) newC.affinity = Math.min(100, Math.max(0, newC.affinity + result.updateAffinity.delta));
                return newC;
              }));
            }

            let pendingItemsToModal = [];

            if (result.itemsGained) {
              if (companions.some(c => c.id === 'stray_cat') && Math.random() < 0.25) {
                result.itemsGained.push('pet_food');
                logStr += " 🐈 (고양이 '나비'가 구석에서 사료 봉지를 물어왔습니다!)";
              }

              const newInv = [...inventory];
              result.itemsGained.forEach(item => {
                if (newInv.length < maxInventorySlots) {
                  newInv.push(item);
                } else {
                  pendingItemsToModal.push(item);
                }
              });
              setInventory(newInv);
            }

            if (result.itemsLost) {
              setInventory(prev => {
                const newInv = [...prev];
                result.itemsLost.forEach(itemToLose => {
                  const idx = newInv.indexOf(itemToLose);
                  if (idx > -1) newInv.splice(idx, 1);
                });
                return newInv;
              });
            }

            if (result.addCompanion) setCompanions(prev => [...prev, result.addCompanion]);
            if (result.removeCompanionId) setCompanions(prev => prev.filter(c => c.id !== result.removeCompanionId));

            if (logStr) setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: logStr, type: 'event' }].slice(-MAX_LOGS));
            
            setActiveEvent(null);

            if (pendingItemsToModal.length > 0) {
              setIsPlaying(false);
              setDiscardModal({ open: true, pendingItems: pendingItemsToModal });
            } else {
              setTimeout(() => {
                setStats(currentStats => { 
                  if(gameState === 'playing' && currentStats.health > 0 && currentStats.hunger > 0 && currentStats.mental > 0) setIsPlaying(true);
                  return currentStats;
                });
              }, 600);
            }
          };

          const handleSelectLocation = (locId) => {
            if (locId === currentLocation) return;
            if (activeEvent) {
              setReservedLocation(locId);
              setLogs(prev => [...prev, { timeStr: formatTime(counters.totalHours), text: `[이동 예약] 현재 상황이 종료된 후 [${LOCATIONS.find(l => l.id === locId)?.name}](으)로 자동 이동합니다.`, type: 'event' }].slice(-MAX_LOGS));
              return;
            }
            
            const targetLoc = LOCATIONS.find(l => l.id === locId);
            const currentLoc = LOCATIONS.find(l => l.id === currentLocation) || LOCATIONS[0];
            
            const dist = Math.abs(targetLoc.distance - currentLoc.distance);
            let baseHours = 1 + (dist * 2);

            let vData = vehicle ? VEHICLE_TYPES[vehicle.id] : null;
            let actualTravelTime = baseHours;
            let vehicleStatusNote = "";

            if (vehicle && vData) {
              actualTravelTime = Math.max(1, Math.round(baseHours * vData.speedMult));
              const cost = dist * vData.costPerDist;

              if (vData.type === 'stamina') {
                setStats(s => ({ ...s, hunger: Math.max(0, s.hunger - cost), health: Math.max(1, s.health - Math.round(cost/2)) }));
                vehicleStatusNote = ` (🚲 자전거 이동: 체력/포만감 추가 소모)`;
              } else {
                if (vehicle.cap >= cost) {
                  setVehicle(v => ({ ...v, cap: v.cap - cost }));
                  vehicleStatusNote = ` (${vData.name} 이동: 게이지 -${cost}%)`;
                } else {
                  actualTravelTime = baseHours;
                  vehicleStatusNote = ` (⚠️ ${vData.name} 연료/배터리 부족으로 도보 이동)`;
                }
              }
            }

            setIsPlaying(false);
            
            const scenarioType = Math.random();
            let travelEvent = {};

            if (vehicle && vehicle.id === 'car' && scenarioType < 0.4) {
              travelEvent = {
                id: 'travel_car_drive',
                text: `[장소 이동: ${targetLoc.name}] 도로 중앙에 감염자 무리가 바글거립니다! 자동차 핸들을 강하게 쥐었습니다. (예상 시간: ${actualTravelTime}시간)${vehicleStatusNote}`,
                choices: [
                  { text: "🚗 액셀을 밟아 그대로 들이받는다!", action: () => {
                      if (vehicle.cap >= 10) {
                        return { setVehicle: { ...vehicle, cap: Math.max(0, vehicle.cap - 10) }, flags: { arrived: locId }, log: "시원하게 감염자 무리를 갈아버리며 안전하게 도착했습니다!" };
                      }
                      return { stats: { health: -20 }, flags: { arrived: locId }, log: "연료 부족으로 차가 멈춰 시동이 꺼졌습니다! 급하게 탈출했습니다." };
                  }},
                  { text: "차를 멈추고 우회로를 찾는다.", action: () => {
                      return { travelTimeMod: 1.4, flags: { arrived: locId }, log: "골목길로 우회하여 목적지에 도착했습니다." };
                  }}
                ]
              };
            } else if (scenarioType < 0.25) {
              travelEvent = {
                id: 'travel_zombie',
                text: `[장소 이동: ${targetLoc.name}] 거리를 가로지르던 중 감염자 무리가 앞길을 막아섰습니다! (예상 시간: ${actualTravelTime}시간)${vehicleStatusNote}`,
                choices: [
                  { text: "무기를 들고 강행 돌파한다.", action: (inv) => {
                      let dmg = 30;
                      if (inv.includes('shotgun') || inv.includes('pistol')) dmg = 5;
                      else if (inv.includes('machete') || inv.includes('bat') || inv.includes('baton')) dmg = 15;
                      return { stats: { health: -dmg, mental: -10 }, flags: { arrived: locId }, log: "무기를 휘두르며 감염자들을 뚫고 돌파했습니다." };
                  }},
                  { text: "먼 길로 우회로를 찾는다 (시간/허기 소모).", action: () => {
                      return { stats: { hunger: -20 }, travelTimeMod: 1.5, flags: { arrived: locId }, log: "우회하여 안전하게 도착했지만 시간이 더 지체되었습니다." };
                  }},
                  { text: "어둠 속에 숨죽여 무리가 지나가길 기다린다.", action: () => {
                      return { stats: { mental: -15 }, travelTimeMod: 2, flags: { arrived: locId }, log: "불안에 떨며 기다린 끝에 길을 빠져나왔습니다." };
                  }}
                ]
              };
            } else if (scenarioType < 0.5) {
              travelEvent = {
                id: 'travel_special_zombie',
                text: `[장소 이동: ${targetLoc.name}] 골목 어귀에서 비정상적으로 거대한 변이 감염자와 마주쳤습니다! (예상 시간: ${actualTravelTime}시간)${vehicleStatusNote}`,
                choices: [
                  { text: "정면으로 맞서 싸운다 (리스크/하이리턴).", action: (inv) => {
                      if (inv.includes('shotgun') || inv.includes('pistol') || inv.includes('machete') || inv.includes('knife') || inv.includes('baton')) return { stats: { health: -15 }, itemsGained: ['medkit'], flags: { arrived: locId }, log: "무기를 활용해 변이 감염자를 처치하고 그 곁에서 구급상자를 발견했습니다!" };
                      return { stats: { health: -40, mental: -20 }, flags: { arrived: locId }, log: "강력한 힘에 압도당해 큰 부상을 입고 도망쳤습니다." };
                  }},
                  { text: "식량을 미끼로 던지고 도망친다.", action: (inv) => {
                      if(inv.includes('ration')) return { itemsLost: ['ration'], flags: { arrived: locId }, log: "전투식량으로 놈의 시선을 돌리고 안전하게 벗어났습니다." };
                      return { stats: { health: -30 }, flags: { arrived: locId }, log: "미끼가 없어 도망치다 매섭게 공격당했습니다." };
                  }},
                  { text: "동료와 흩어지며 교란한다 (호감도 감소).", action: (inv, counters, trait, companions) => {
                      if(companions.length > 0) {
                        const target = companions[0];
                        return { updateAffinity: { id: target.id, delta: -20 }, flags: { arrived: locId }, log: "동료를 미끼 삼아 도망쳤습니다. 동료의 호감도가 크게 하락합니다." };
                      }
                      return { stats: { health: -25 }, flags: { arrived: locId }, log: "혼자 교란하려다 다치기만 했습니다." };
                  }},
                  { text: "조용히 뒤로 물러나 다른 길을 찾는다.", action: () => {
                      return { stats: { hunger: -15, mental: -5 }, travelTimeMod: 1.5, flags: { arrived: locId }, log: "변이체의 눈을 피해 멀리 돌아갔습니다." };
                  }}
                ]
              };
            } else if (scenarioType < 0.75) {
              travelEvent = {
                id: 'travel_supply',
                text: `[장소 이동: ${targetLoc.name}] 버려진 장갑차 옆에서 굳게 닫힌 보급상자를 발견했습니다. (예상 시간: ${actualTravelTime}시간)${vehicleStatusNote}`,
                choices: [
                  { text: "힘으로 억지로 연다 (부상 위험).", action: () => {
                      const hurt = Math.random() < 0.5;
                      if(hurt) return { stats: { health: -10 }, itemsGained: ['ration'], flags: { arrived: locId }, log: "철제 모서리에 손을 다쳤지만 식량을 얻었습니다." };
                      return { itemsGained: ['medkit', 'ration'], flags: { arrived: locId }, log: "상자를 열어 유용한 물자를 챙겼습니다." };
                  }},
                  { text: "도구를 이용해 틈을 벌린다.", action: (inv) => {
                      if(inv.includes('machete') || inv.includes('knife') || inv.includes('bat')) return { itemsGained: ['radio', 'ration'], flags: { arrived: locId }, log: "도구를 사용해 안전하게 열어 물자를 챙겼습니다." };
                      return { flags: { arrived: locId }, log: "적절한 도구가 없어 흠집만 내고 발길을 돌렸습니다." };
                  }},
                  { text: "함정일지 모르니 무시하고 간다.", action: () => {
                      return { stats: { mental: +5 }, flags: { arrived: locId }, log: "안전을 최우선으로 여겨 발걸음을 재촉했습니다." };
                  }}
                ]
              };
            } else {
              travelEvent = {
                id: 'travel_safe',
                text: `[장소 이동: ${targetLoc.name}] 거리는 핏자국만 남은 채 고요합니다. (예상 시간: ${actualTravelTime}시간)${vehicleStatusNote}`,
                choices: [
                  { text: "빠르게 이동한다.", action: () => {
                      return { stats: { hunger: -15 }, travelTimeMod: 0.6, flags: { arrived: locId }, log: "체력을 소모해 단시간에 목적지에 도착했습니다." };
                  }},
                  { text: "주변을 꼼꼼히 살피며 걷는다.", action: () => {
                      const found = Math.random() < 0.3 ? ['wet_wipes'] : [];
                      return { itemsGained: found, flags: { arrived: locId }, log: found.length ? "이동 중 운좋게 물티슈를 줍고 도착했습니다." : "무사히 목적지에 도착했습니다." };
                  }},
                  { text: "동료와 대화하며 긴장을 푼다.", action: (inv, counters, trait, companions) => {
                      if(companions.length > 0) {
                          const c = companions[Math.floor(Math.random()*companions.length)];
                          return { updateAffinity: { id: c.id, delta: +10 }, flags: { arrived: locId }, log: `[${c.name}]와(과) 대화하며 서로의 호감도가 상승했습니다.` };
                      }
                      return { stats: { mental: -5 }, flags: { arrived: locId }, log: "혼잣말을 하다 우울해진 채로 도착했습니다." };
                  }}
                ]
              };
            }

            travelEvent.baseTravelTime = actualTravelTime;
            setActiveEvent(travelEvent);
          };

          useEffect(() => {
            if (!activeEvent && reservedLocation && isPlaying && gameState === 'playing') {
              const loc = reservedLocation;
              setReservedLocation(null);
              handleSelectLocation(loc);
            }
          }, [activeEvent, reservedLocation, isPlaying, gameState]);

          const handleCraftingUse = (actionType) => {
            const maxHealth = trait?.id === 'strong' ? 120 : 100;
            if (actionType === 'smoke') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('cigarette'), 1); return newInv; });
              setStats(prev => ({ ...prev, mental: Math.min(100, prev.mental + 40) }));
            } else if (actionType === 'heal') {
              const healAmount = companions.some(c => c.id === 'pharmacist') ? 75 : 50;
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('medkit'), 1); return newInv; });
              setStats(prev => ({ ...prev, health: Math.min(maxHealth, prev.health + healAmount) }));
            } else if (actionType === 'eat_ration') {
              const hungerAmount = companions.some(c => c.id === 'chef') ? 100 : 80;
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('ration'), 1); return newInv; });
              setStats(prev => ({ ...prev, hunger: Math.min(100, prev.hunger + hungerAmount), health: Math.min(maxHealth, prev.health + 15) }));
              setCompanions(prev => prev.map(c => ({ ...c, loyalty: Math.min(100, c.loyalty + 10), affinity: Math.min(100, c.affinity + 5) })));
            } else if (actionType === 'use_soap') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('soap'), 1); return newInv; });
              setStats(prev => ({ ...prev, hygiene: Math.min(100, prev.hygiene + 60), mental: Math.min(100, prev.mental + 10) }));
            } else if (actionType === 'use_wipes') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('wet_wipes'), 1); return newInv; });
              setStats(prev => ({ ...prev, hygiene: Math.min(100, prev.hygiene + 35) }));
            } else if (actionType === 'refuel_vehicle') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('gas_can'), 1); return newInv; });
              setVehicle(v => ({ ...v, cap: Math.min(100, v.cap + 50) }));
            } else if (actionType === 'charge_kickboard') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('battery_pack'), 1); return newInv; });
              setVehicle(v => ({ ...v, cap: Math.min(100, v.cap + 40) }));
            } else if (actionType === 'use_chocolate') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('chocolate'), 1); return newInv; });
              setStats(prev => ({ ...prev, mental: Math.min(100, prev.mental + 30) }));
            } else if (actionType === 'use_coffee') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('coffee'), 1); return newInv; });
              setStats(prev => ({ ...prev, mental: Math.min(100, prev.mental + 20), hunger: Math.min(100, prev.hunger + 10) }));
            } else if (actionType === 'feed_pet') {
              setInventory(prev => { const newInv = [...prev]; newInv.splice(newInv.indexOf('pet_food'), 1); return newInv; });
              setCompanions(prev => prev.map(c => (c.role === '군견' || c.role === '길고양이') ? { ...c, loyalty: 100, affinity: 100 } : c));
              setStats(prev => ({ ...prev, mental: Math.min(100, prev.mental + 25) }));
            }
          };

          const getItemVisual = (id) => {
            const data = { 
              'bat': { icon: '🏏', name: '야구 배트' }, 'medkit': { icon: '🚑', name: '구급상자' }, 
              'lighter': { icon: '🔥', name: '라이터' }, 'cigarette': { icon: '🚬', name: '담배' }, 
              'soju': { icon: '🍾', name: '소주' }, 'baton': { icon: '🚓', name: '진압봉' }, 
              'ration': { icon: '🥫', name: '전투식량' }, 'knife': { icon: '🗡️', name: '군용 단검' },
              'soap': { icon: '🧼', name: '비누' }, 'wet_wipes': { icon: '🧻', name: '물티슈' },
              'radio': { icon: '📻', name: '무전기' }, 'gas_can': { icon: '⛽', name: '휘발유 캔' },
              'battery_pack': { icon: '🔋', name: '휴대용 배터리' }, 'pet_food': { icon: '🥩', name: '반려동물 사료' }, 
              'chocolate': { icon: '🍫', name: '초콜릿' }, 'coffee': { icon: '☕', name: '캔커피' },
              'pistol': { icon: '🔫', name: '권총' }, 'shotgun': { icon: '💥', name: '샷건' }, 'machete': { icon: '🗡️', name: '마체테' }
            };
            return data[id] || { icon: '📦', name: '알 수 없음' };
          };

          // === [버리기 모달 처리 로직] ===
          const handleDiscardChoice = (discardedItemIndex, isPendingItem = false) => {
            if (isPendingItem) {
              const updatedPending = [...discardModal.pendingItems];
              updatedPending.splice(discardedItemIndex, 1);
              if (updatedPending.length > 0 && inventory.length >= maxInventorySlots) {
                setDiscardModal({ open: true, pendingItems: updatedPending });
              } else {
                setInventory(prev => [...prev, ...updatedPending].slice(0, maxInventorySlots));
                setDiscardModal({ open: false, pendingItems: [] });
                setIsPlaying(true);
              }
            } else {
              const updatedInv = [...inventory];
              const droppedItem = updatedInv.splice(discardedItemIndex, 1)[0];
              const nextPending = [...discardModal.pendingItems];
              if (nextPending.length > 0) {
                updatedInv.push(nextPending.shift());
              }
              setInventory(updatedInv);
              if (nextPending.length > 0 && updatedInv.length >= maxInventorySlots) {
                setDiscardModal({ open: true, pendingItems: nextPending });
              } else {
                setDiscardModal({ open: false, pendingItems: [] });
                setIsPlaying(true);
              }
            }
          };

          const currentDay = Math.floor(counters.totalHours / 24) + 1;
          const maxHealth = trait?.id === 'strong' ? 120 : 100;

          if (gameState === 'opening') {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-6 font-sans">
                <h1 className="text-5xl md:text-7xl font-black text-[#d84b4b] mb-10 tracking-[0.2em]">생존왕 THE ZOMBIE</h1>
                <button onClick={() => setGameState('setup')} className="px-12 py-4 border border-[#d84b4b] text-[#d84b4b] hover:bg-[#d84b4b] hover:text-[#0a0505] font-bold tracking-widest transition-colors duration-300">지옥문 열기</button>
              </div>
            );
          }

          if (gameState === 'setup') {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-6 font-sans animate-fade-in">
                <div className="w-full max-w-md bg-[#1a1111] border border-[#3a1f1f] p-8 space-y-6 shadow-2xl">
                  <h2 className="text-xl font-black text-[#d84b4b] text-center border-b border-[#3a1f1f] pb-4 tracking-widest">생존자 설정</h2>
                  <div className="space-y-2">
                    <label className="text-xs text-[#8f7a7a] font-bold">생존자 이름</label>
                    <input type="text" value={player.name} onChange={(e) => setPlayer({ ...player, name: e.target.value })} placeholder="이름을 입력하세요" className="w-full bg-[#110b0b] border border-[#3a1f1f] p-3 text-sm focus:border-[#d84b4b] text-[#f8f8f2] outline-none" />
                  </div>
                  <div className="space-y-2">
                    <label className="text-xs text-[#8f7a7a] font-bold">성별 선택</label>
                    <div className="grid grid-cols-2 gap-2">
                      {['남성', '여성'].map(g => (
                        <button key={g} onClick={() => setPlayer({ ...player, gender: g })} className={`py-2.5 text-xs font-bold border transition-colors ${player.gender === g ? 'bg-[#d84b4b] border-[#d84b4b] text-[#0a0505]' : 'bg-[#110b0b] border-[#3a1f1f] text-[#8f7a7a]'}`}>
                          {g === '남성' ? '👨 남성' : '👩 여성'}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="p-4 bg-[#110b0b] border border-[#3a1f1f] text-xs text-[#8f7a7a] space-y-1.5 leading-relaxed">
                    <p>🤖 **자동 아이템 사용**: 각 게이지가 10% 미만으로 떨어질 때 인벤토리의 해당 회복 아이템이 자동으로 소비됩니다.</p>
                    <p>🚗 **운송수단 시스템**: 자동차, 오토바이, 킥보드 등으로 이동 시간이 단축됩니다.</p>
                    <p>🐕 **애완동물/동료**: 다양한 특성을 가진 동료를 영입해 도움을 받으세요.</p>
                  </div>
                  <button onClick={startGame} disabled={!player.name} className="w-full bg-[#d84b4b] text-[#0a0505] font-bold py-4 mt-2 tracking-widest disabled:bg-[#2b1b1b] disabled:text-[#4a1c1c] transition-colors">생존 시작</button>
                </div>
              </div>
            );
          }

          // === 사망 화면 ===
          if (gameState === 'gameover') {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-6 font-sans animate-fade-in max-w-2xl mx-auto">
                <h1 className="text-6xl font-black text-[#d84b4b] mb-4 tracking-widest">사망</h1>
                <div className="bg-[#1a1111] border border-[#3a1f1f] p-6 text-center text-sm text-[#c7b8b8] space-y-2 w-full mb-4">
                  <h2 className="text-[#d84b4b] font-bold text-lg mb-3">마지막 생존 기록</h2>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <p>생존 시간: {formatTime(counters.totalHours)} ({currentDay}일)</p>
                    <p>최후의 장소: {LOCATIONS.find(l => l.id === currentLocation)?.name || '알 수 없음'}</p>
                    <p>함께한 동료: {companions.length}명</p>
                    <p>소지한 아이템: {inventory.length}개</p>
                  </div>
                </div>

                <div className="w-full bg-[#110b0b] border border-[#3a1f1f] p-4 text-xs h-64 overflow-y-auto custom-scrollbar mb-6 space-y-2 text-left">
                  <h3 className="text-[#d84b4b] font-bold mb-2 border-b border-[#3a1f1f] pb-1">📜 전체 생존 일지 기록</h3>
                  {logs.map((log, idx) => (
                    <div key={idx} className={`flex space-x-2 ${log.type === 'event' ? 'text-[#d84b4b] font-bold' : 'text-[#8f7a7a]'}`}>
                      <span className="shrink-0 text-[10px]">[{log.timeStr}]</span>
                      <span className="leading-relaxed">{log.text}</span>
                    </div>
                  ))}
                </div>

                <button onClick={() => window.location.reload()} className="px-8 py-3 border border-[#8f7a7a] text-[#8f7a7a] hover:bg-[#f8f8f2] hover:text-[#0a0505] transition-colors tracking-widest">다시 시작</button>
              </div>
            );
          }

          return (
            <div className="min-h-screen flex flex-col animate-fade-in relative">
              
              {/* === [가방 꽉 참 - 아이템 선택 버리기 모달] === */}
              {discardModal.open && (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                  <div className="bg-[#1a1111] border-2 border-[#d84b4b] p-6 max-w-md w-full space-y-4 text-center animate-fade-in">
                    <h2 className="text-lg font-bold text-[#d84b4b]">⚠️ 가방 공간 부족</h2>
                    <p className="text-xs text-[#c7b8b8] leading-relaxed">
                      가방이 꽉 찼습니다! 획득한 새 아이템을 챙기려면 버릴 아이템 하나를 선택해주세요.
                    </p>
                    
                    <div className="space-y-3">
                      <div>
                        <div className="text-xs text-[#8f7a7a] font-bold mb-1.5 text-left">📦 현재 가방 소지품 (클릭 시 버림):</div>
                        <div className="grid grid-cols-2 gap-2">
                          {inventory.map((itemId, idx) => (
                            <button key={idx} onClick={() => handleDiscardChoice(idx, false)} className="p-2 border border-[#3a1f1f] bg-[#110b0b] hover:border-[#d84b4b] text-xs flex items-center space-x-2">
                              <span className="text-lg">{getItemVisual(itemId).icon}</span>
                              <span className="truncate">{getItemVisual(itemId).name}</span>
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="border-t border-[#3a1f1f] pt-3">
                        <div className="text-xs text-[#d84b4b] font-bold mb-1.5 text-left">✨ 새로 습득한 아이템 (클릭 시 포기):</div>
                        <div className="grid grid-cols-2 gap-2">
                          {discardModal.pendingItems.map((itemId, idx) => (
                            <button key={idx} onClick={() => handleDiscardChoice(idx, true)} className="p-2 border border-[#d84b4b] bg-[#231717] hover:bg-[#d84b4b] hover:text-[#0a0505] text-xs flex items-center space-x-2">
                              <span className="text-lg">{getItemVisual(itemId).icon}</span>
                              <span className="truncate">{getItemVisual(itemId).name} (버리기)</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              <div className="h-16 bg-[#110b0b] border-b border-[#3a1f1f] flex items-center justify-between px-6 shrink-0">
                <span className="font-black text-[#d84b4b] tracking-widest text-lg">생존왕 | THE ZOMBIE</span>
                <div className="text-xs text-[#d84b4b] font-bold">난이도 배율: {(1 + (Math.floor(counters.totalHours / 24) * 0.08)).toFixed(2)}x</div>
              </div>

              <div className="flex-1 max-w-[1400px] w-full mx-auto grid grid-cols-1 lg:grid-cols-4 gap-4 p-4 min-h-0">
                
                {/* 좌측 상태 패널 */}
                <div className="col-span-1 flex flex-col space-y-4 overflow-y-auto custom-scrollbar pr-2">
                  <div className="bg-[#231717] border border-[#3a1f1f] p-4 text-center">
                    <h2 className="text-xl font-bold tracking-widest">{player.name} ({player.gender})</h2>
                    {trait && (
                      <div className="mt-2 text-xs p-2 border border-[#d84b4b] bg-[#1a1111] text-[#d84b4b] font-bold text-left">
                        <div className="text-sm mb-0.5">{trait.name}</div>
                        <div className="text-[10px] text-[#8f7a7a] font-normal">{trait.desc}</div>
                      </div>
                    )}
                    <div className="mt-2 text-xs py-1 px-3 border border-[#3a1f1f] bg-[#110b0b] text-[#c7b8b8]">
                      {counters.hasShelter ? '안전한 은신처 확보됨' : `[탐색] ${LOCATIONS.find(l => l.id === currentLocation)?.name}`}
                    </div>
                  </div>

                  {/* 탑승 중인 운송수단 패널 */}
                  <div className="bg-[#231717] border border-[#3a1f1f] p-4">
                    <h3 className="text-xs font-bold text-[#8f7a7a] mb-2 tracking-widest flex justify-between">
                      <span>보유 운송수단</span>
                      {vehicle && <button onClick={() => setVehicle(null)} className="text-[10px] text-[#d84b4b] underline">버리기</button>}
                    </h3>
                    {vehicle ? (
                      <div className="bg-[#110b0b] p-3 border border-[#3a1f1f] text-xs space-y-2">
                        <div className="font-bold text-[#d84b4b]">{VEHICLE_TYPES[vehicle.id]?.name}</div>
                        <div className="text-[10px] text-[#8f7a7a]">{VEHICLE_TYPES[vehicle.id]?.desc}</div>
                        {VEHICLE_TYPES[vehicle.id]?.type !== 'stamina' && (
                          <div className="space-y-1">
                            <div className="flex justify-between text-[10px]">
                              <span>남은 게이지</span>
                              <span className="font-bold text-[#a67c00]">{vehicle.cap}%</span>
                            </div>
                            <div className="w-full bg-[#1a1111] h-1.5 border border-[#3a1f1f]">
                              <div className="bg-[#a67c00] h-full transition-all duration-300" style={{ width: `${vehicle.cap}%` }}></div>
                            </div>
                          </div>
                        )}
                      </div>
                    ) : (
                      <p className="text-xs text-[#554444] italic">보유한 운송수단이 없습니다. (도보 이동)</p>
                    )}
                  </div>

                  <div className="bg-[#231717] border border-[#3a1f1f] p-4 space-y-4">
                    <div className="space-y-1"><div className="flex justify-between text-xs mb-1">건강<span className="text-[#d84b4b] font-bold">{Math.round(stats.health)} / {maxHealth}</span></div><div className="w-full bg-[#110b0b] h-1.5 border border-[#3a1f1f]"><div className="bg-[#8b2626] h-full transition-all duration-500" style={{ width: `${(stats.health / maxHealth) * 100}%` }}></div></div></div>
                    <div className="space-y-1"><div className="flex justify-between text-xs mb-1">포만감<span className="text-[#a67c00] font-bold">{Math.round(stats.hunger)}%</span></div><div className="w-full bg-[#110b0b] h-1.5 border border-[#3a1f1f]"><div className="bg-[#a67c00] h-full transition-all duration-500" style={{ width: `${stats.hunger}%` }}></div></div></div>
                    <div className="space-y-1"><div className="flex justify-between text-xs mb-1">정신력<span className="text-[#38587a] font-bold">{Math.round(stats.mental)}%</span></div><div className="w-full bg-[#110b0b] h-1.5 border border-[#3a1f1f]"><div className="bg-[#38587a] h-full transition-all duration-500" style={{ width: `${stats.mental}%` }}></div></div></div>
                    <div className="space-y-1"><div className="flex justify-between text-xs mb-1">위생<span className="text-[#2e8b57] font-bold">{Math.round(stats.hygiene)}%</span></div><div className="w-full bg-[#110b0b] h-1.5 border border-[#3a1f1f]"><div className="bg-[#2e8b57] h-full transition-all duration-500" style={{ width: `${stats.hygiene}%` }}></div></div></div>
                  </div>

                  <div className="bg-[#231717] border border-[#3a1f1f] p-4">
                    <h3 className="text-xs font-bold text-[#8f7a7a] mb-3 tracking-widest flex justify-between">
                      <span>동료 무리</span>
                      <span className="text-[#d84b4b]">{companions.length}명</span>
                    </h3>
                    {companions.length === 0 ? (
                      <p className="text-xs text-[#554444] italic">함께하는 동료가 없습니다.</p>
                    ) : (
                      <div className="space-y-3">
                        {companions.map((comp, idx) => (
                          <div key={idx} className="p-2 bg-[#110b0b] border border-[#3a1f1f] text-xs">
                            <div className="font-bold text-[#d84b4b]">{comp.name} ({comp.role}) <span className="text-[10px] text-[#2e8b57] font-normal block mt-0.5">{comp.desc}</span></div>
                            <div className="flex justify-between items-center text-[10px] mt-1.5">
                              <span className={comp.loyalty < 35 ? "text-[#d84b4b] font-bold" : "text-[#a67c00]"}>충성도 {comp.loyalty}%</span>
                              <span className="text-[#e271ac]">호감도 {comp.affinity}%</span>
                            </div>
                            <div className="flex gap-1 mt-1 h-1.5">
                              <div className="w-1/2 bg-[#1a1111] border border-[#221515]"><div className={`h-full transition-all duration-300 ${comp.loyalty < 35 ? 'bg-[#d84b4b]' : 'bg-[#a67c00]'}`} style={{ width: `${comp.loyalty}%` }}></div></div>
                              <div className="w-1/2 bg-[#1a1111] border border-[#221515]"><div className="bg-[#e271ac] h-full transition-all duration-300" style={{ width: `${comp.affinity}%` }}></div></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* 중앙 생존 일지 패널 */}
                <div className="col-span-1 lg:col-span-2 flex flex-col bg-[#110b0b] border border-[#3a1f1f] shadow-inner overflow-hidden h-[500px] md:h-[650px]">
                  <div className="bg-[#231717] px-4 py-2.5 border-b border-[#3a1f1f] flex justify-between items-center shrink-0">
                    <h3 className="text-[11px] font-bold text-[#c7b8b8] tracking-widest shrink-0">생존 일지</h3>
                    <div className="flex justify-center flex-1 mx-2">
                      <div className="flex items-center space-x-1 bg-[#110b0b] p-1 border border-[#3a1f1f]">
                        {[ { speed: isPlaying ? 0 : 1, label: isPlaying ? '⏸️ 일시정지' : '▶️ 재생' }, { speed: 2, label: '2x' }, { speed: 4, label: '4x' }, { speed: 8, label: '8x' }, { speed: 16, label: '16x' } ].map((btn, idx) => (
                          <button key={idx} onClick={() => { if (idx === 0) { setIsPlaying(!isPlaying); if (!isPlaying && gameSpeed === 0) setGameSpeed(1); } else { setGameSpeed(btn.speed); setIsPlaying(true); } }} className={`px-2 py-0.5 text-[10px] font-bold transition-colors ${(idx === 0 && !isPlaying) || (idx > 0 && gameSpeed === btn.speed && isPlaying) ? 'bg-[#d84b4b] text-[#0a0505]' : 'bg-[#1a1111] text-[#8f7a7a] hover:text-[#f8f8f2]'}`}>
                            {btn.label}
                          </button>
                        ))}
                      </div>
                    </div>
                    <span className="text-[11px] font-bold text-[#8f7a7a] text-right shrink-0">{formatTime(counters.totalHours)}</span>
                  </div>

                  {activeEvent && (
                    <div className="border-b-2 border-[#d84b4b] bg-[#231717] p-5 shadow-[0_4px_15px_rgba(216,75,75,0.15)] animate-fade-in shrink-0 max-h-[360px] overflow-y-auto custom-scrollbar">
                      <p className="text-[#d84b4b] text-[10px] font-bold tracking-widest mb-3 uppercase">{activeEvent.id.includes('travel') ? "이동 이벤트" : "운명의 갈림길"}</p>
                      <p className="text-[15px] text-[#f8f8f2] mb-6 leading-relaxed break-keep">{activeEvent.text}</p>
                      <div className="space-y-2">
                        {activeEvent.choices.map((choice, idx) => (
                          <button key={idx} onClick={() => handleChoice(choice)} className="w-full text-left bg-[#110b0b] border border-[#3a1f1f] text-[#f8f8f2] p-3 text-sm hover:border-[#d84b4b] transition-colors">
                            {choice.text}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div ref={logContainerRef} className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                    {logs.map((log, idx) => (
                      <div key={idx} className={`flex space-x-3 text-sm ${log.type === 'event' ? 'text-[#d84b4b] font-bold' : 'text-[#c7b8b8]'}`}>
                        <div className="shrink-0 w-24 font-bold text-[#8f7a7a] text-[11px] pt-[3px] tracking-widest">[{log.timeStr}]</div>
                        <div className="flex-1 leading-relaxed break-keep whitespace-pre-line">{log.text}</div>
                      </div>
                    ))}
                    <div ref={logEndRef}></div>
                  </div>
                </div>

                {/* 우측 인벤토리 및 행동 패널 */}
                <div className="col-span-1 flex flex-col space-y-4 overflow-y-auto custom-scrollbar pr-2">
                  <div className="bg-[#231717] border border-[#3a1f1f] p-4">
                    <h3 className="text-xs font-bold text-[#8f7a7a] mb-4 tracking-widest flex justify-between">
                      <span>소지품</span>
                      <span className={inventory.length >= maxInventorySlots ? "text-[#d84b4b]" : "text-[#8f7a7a]"}>{inventory.length} / {maxInventorySlots}</span>
                    </h3>
                    <div className="grid grid-cols-2 gap-2">
                      {Array.from({ length: maxInventorySlots }).map((_, idx) => {
                        const itemId = inventory[idx];
                        return (
                          <div key={idx} className={`flex flex-col items-center justify-center p-3 border text-center h-20 ${itemId ? 'bg-[#110b0b] border-[#3a1f1f]' : 'bg-[#110b0b]/40 border-[#221515] text-[#443333]'}`}>
                            {itemId ? (
                              <>
                                <span className="text-2xl mb-1">{getItemVisual(itemId).icon}</span>
                                <span className="text-[11px] font-bold">{getItemVisual(itemId).name}</span>
                              </>
                            ) : (
                              <span className="text-xs italic text-[#443333]">비어있음</span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {(isPlaying || activeEvent) && (
                    <div className="bg-[#231717] border border-[#38587a] p-4 transition-all">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-xs font-bold text-[#38587a] tracking-widest">목적지 이동 (수색)</h3>
                        {activeEvent && <span className="text-[10px] text-[#d84b4b] font-bold animate-pulse">상황 진행 중 (이동 예약 가능)</span>}
                      </div>
                      {counters.hasShelter && <p className="text-xs text-[#d84b4b] mb-3 font-bold">⚠️ 이동 시 은신처를 잃게 됩니다.</p>}
                      <div className="grid grid-cols-1 gap-2 max-h-[220px] overflow-y-auto custom-scrollbar pr-1">
                        {LOCATIONS.map(loc => {
                          const currentLocData = LOCATIONS.find(l => l.id === currentLocation) || LOCATIONS[0];
                          const dist = Math.abs(loc.distance - currentLocData.distance);
                          const isCurrent = currentLocation === loc.id;
                          
                          let speedMod = vehicle ? VEHICLE_TYPES[vehicle.id]?.speedMult || 1 : 1;
                          let estTime = Math.max(1, Math.round((1 + dist * 2) * speedMod));

                          return (
                            <button
                              key={loc.id} onClick={() => handleSelectLocation(loc.id)} disabled={isCurrent && !counters.hasShelter}
                              className={`text-left border p-3 text-xs transition-colors ${reservedLocation === loc.id ? 'bg-[#2b3a4a] border-[#5a86b5] text-[#f8f8f2]' : (isCurrent && !counters.hasShelter ? 'bg-[#3a1f1f] border-[#d84b4b] text-[#f8f8f2] cursor-default' : 'bg-[#110b0b] border-[#3a1f1f] text-[#8f7a7a] hover:border-[#38587a] hover:text-[#f8f8f2]')}`}
                            >
                              <div className="font-bold mb-1 flex justify-between">
                                <span>
                                  {loc.name} {isCurrent && !counters.hasShelter ? '(현재 위치)' : ''}
                                  {reservedLocation === loc.id && <span className="ml-2 text-[#5a86b5] animate-pulse">[예약됨]</span>}
                                </span>
                                {!isCurrent && <span className="text-[10px] text-[#38587a]">소요 {estTime}시간</span>}
                              </div>
                              <div className="text-[10px] leading-relaxed break-keep">{loc.desc}</div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {(inventory.includes('medkit') || inventory.includes('ration') || inventory.includes('soap') || inventory.includes('wet_wipes') || inventory.includes('gas_can') || inventory.includes('battery_pack') || inventory.includes('pet_food') || inventory.includes('chocolate') || inventory.includes('coffee') || (inventory.includes('lighter') && inventory.includes('cigarette'))) && (isPlaying || activeEvent) && (
                    <div className="bg-[#231717] border border-[#38587a] p-4 animate-fade-in">
                      <h3 className="text-xs font-bold text-[#38587a] mb-4 tracking-widest">소모품 수동 사용</h3>
                      <div className="space-y-2">
                        {inventory.includes('gas_can') && vehicle && (vehicle.id === 'motorcycle' || vehicle.id === 'car') && (
                          <button onClick={() => handleCraftingUse('refuel_vehicle')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">⛽ 휘발유 주유 (연료 +50%)</button>
                        )}
                        {inventory.includes('battery_pack') && vehicle && vehicle.id === 'kickboard' && (
                          <button onClick={() => handleCraftingUse('charge_kickboard')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🔋 킥보드 충전 (배터리 +40%)</button>
                        )}
                        {inventory.includes('pet_food') && companions.some(c => c.role === '군견' || c.role === '길고양이') && (
                          <button onClick={() => handleCraftingUse('feed_pet')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🥩 반려동물 사료 주기 (애완동물 친밀도 MAX)</button>
                        )}
                        {inventory.includes('chocolate') && <button onClick={() => handleCraftingUse('use_chocolate')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🍫 초콜릿 먹기 (정신력 회복)</button>}
                        {inventory.includes('coffee') && <button onClick={() => handleCraftingUse('use_coffee')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">☕ 캔커피 마시기 (정신력 회복)</button>}
                        {inventory.includes('soap') && <button onClick={() => handleCraftingUse('use_soap')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🧼 비누 사용</button>}
                        {inventory.includes('wet_wipes') && <button onClick={() => handleCraftingUse('use_wipes')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🧻 물티슈 사용</button>}
                        {inventory.includes('lighter') && inventory.includes('cigarette') && <button onClick={() => handleCraftingUse('smoke')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🚬 담배 피우기</button>}
                        {inventory.includes('medkit') && <button onClick={() => handleCraftingUse('heal')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🚑 구급상자 사용</button>}
                        {inventory.includes('ration') && <button onClick={() => handleCraftingUse('eat_ration')} className="w-full text-left p-2.5 text-xs border border-[#3a1f1f] bg-[#110b0b] hover:bg-[#3a1f1f] transition-colors">🥫 전투식량 섭취 (동료 충성도/호감도↑)</button>}
                      </div>
                    </div>
                  )}
                </div>

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SurvivalGame />);
    </script>
</body>
</html>
