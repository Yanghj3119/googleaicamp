        // Web Audio API Sound Engine
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }

            play(type) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    if (type === 'click') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(700, now);
                        osc.frequency.exponentialRampToValueAtTime(350, now + 0.05);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                    } else if (type === 'correct') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(523.25, now);
                        osc.frequency.setValueAtTime(659.25, now + 0.08);
                        osc.frequency.setValueAtTime(783.99, now + 0.16);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                    } else if (type === 'damage') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(250, now);
                        osc.frequency.linearRampToValueAtTime(60, now + 0.25);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                    } else if (type === 'gameover') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(350, now);
                        osc.frequency.linearRampToValueAtTime(80, now + 0.7);
                        gain.gain.setValueAtTime(0.35, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                        osc.start(now);
                        osc.stop(now + 0.7);
                    } else if (type === 'victory') {
                        const notes = [523.25, 659.25, 783.99, 1046.50];
                        notes.forEach((freq, idx) => {
                            const noteOsc = this.ctx.createOscillator();
                            const noteGain = this.ctx.createGain();
                            noteOsc.connect(noteGain);
                            noteGain.connect(this.ctx.destination);
                            noteOsc.type = 'sine';
                            noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                            noteGain.gain.setValueAtTime(0.2, now + idx * 0.1);
                            noteGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.35);
                            noteOsc.start(now + idx * 0.1);
                            noteOsc.stop(now + idx * 0.1 + 0.35);
                        });
                    }
                } catch(e) {
                    console.error("Audio Engine Error:", e);
                }
            }
        }

                    soundLabel.innerText = "사운드 OFF";
                    soundIcon.setAttribute('data-lucide', 'volume-x');
                }
                lucide.createIcons();
            }

            toggleSound() {
                this.state.soundEnabled = !this.state.soundEnabled;
                audio.enabled = this.state.soundEnabled;
                localStorage.setItem('sk_sound', this.state.soundEnabled);
                this.updateHeaderUI();
                this.showToast(this.state.soundEnabled ? "🔊 사운드가 활성화되었습니다." : "🔇 음소거되었습니다.");

            showToast(msg) {
                const toast = document.getElementById('toast');

                toast.classList.add('translate-y-0', 'opacity-100');
                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2200);

                                </div>
                                <div>
                                    <span class="text-gray-400 block">난이도 패치</span>
                                    <strong class="text-red-400 text-base font-bold">EXTREME UPGRADED</strong>
                                </div>
                                <div>
                                    <span class="text-gray-400 block">문항 제한시간</span>

                                    <span class="text-gray-400 block">나의 최고 점수</span>

                            </div>
                        </div>
                    </div>

                    <!-- CATEGORY FILTER BUTTONS -->
                    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
                        <div class="flex items-center gap-2 overflow-x-auto pb-1 font-mono text-xs">
                            <button onclick="app.setFilter('all')" class="px-4 py-2 rounded-xl transition font-bold border ${this.state.filterCategory === 'all' ? 'bg-king-gold text-black border-king-gold' : 'bg-king-card border-king-border text-gray-400 hover:text-white'}">
                                🔥 전체 시나리오 (${SURVIVAL_TOPICS.length})
                            </button>
                            <button onclick="app.setFilter('life')" class="px-4 py-2 rounded-xl transition font-bold border ${this.state.filterCategory === 'life' ? 'bg-king-gold text-black border-king-gold' : 'bg-king-card border-king-border text-gray-400 hover:text-white'}">
                                🏢 현실/일상 생존
                            </button>
                            <button onclick="app.setFilter('disaster')" class="px-4 py-2 rounded-xl transition font-bold border ${this.state.filterCategory === 'disaster' ? 'bg-king-gold text-black border-king-gold' : 'bg-king-card border-king-border text-gray-400 hover:text-white'}">
                                🌋 극한/재난 생존
                            </button>
                        </div>
                        <p class="text-xs text-gray-400 font-mono">카드를 클릭하여 즉시 시뮬레이션 시작</p>
                    </div>

                    <!-- TOPICS GRID PANELS -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                `;

                filteredTopics.forEach(topic => {
                    const isBadgeUnlocked = this.state.unlockedBadges.includes(topic.id);
                    
                    html += `
                        <div onclick="app.startQuiz('${topic.id}')" class="panel-card bg-king-card border border-king-border hover:border-king-gold/80 rounded-2xl overflow-hidden cursor-pointer transition-all duration-300 hover:-translate-y-1.5 shadow-xl flex flex-col justify-between relative group">
                            
                            <div class="relative h-48 w-full overflow-hidden bg-black/60">
                                <img src="${topic.image}" onerror="this.src='https://placehold.co/600x400/101420/ffd700?text=${encodeURIComponent(topic.title)}'" alt="${topic.title}" class="panel-card-img w-full h-full object-cover">
                                
                                <div class="absolute inset-0 bg-gradient-to-t from-king-card via-black/30 to-transparent"></div>

                                <div class="absolute top-3 left-3 px-2.5 py-1 rounded-lg bg-black/70 backdrop-blur-md border border-white/10 text-white text-[11px] font-mono font-bold flex items-center gap-1.5">
                                    <i data-lucide="${topic.icon}" class="w-3.5 h-3.5 text-king-gold"></i>
                                    <span>8 STAGES</span>
                                </div>

                                <div class="absolute top-3 right-3 px-2.5 py-1 rounded-lg bg-red-950/80 backdrop-blur-md border border-red-500/30 text-red-400 text-[11px] font-mono font-bold">
                                    ★ ${topic.difficulty.toFixed(1)} / 5.0
                                </div>

                                ${isBadgeUnlocked ? `
                                    <div class="absolute bottom-3 right-3 px-2.5 py-1 rounded-lg bg-king-gold/90 text-black text-[10px] font-bold font-mono flex items-center gap-1 shadow-lg">
                                        🎖️ 훈장 보유
                                    </div>
                                ` : ''}
                            </div>

                            <div class="p-5 flex-1 flex flex-col justify-between">
                                <div>
                                    <h3 class="text-lg font-bold text-white group-hover:text-king-gold transition mb-2 flex items-center gap-2">
                                        ${topic.title}
                                    </h3>
                                    <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed mb-4">
                                        ${topic.desc}
                                    </p>
                                </div>

                                <div class="pt-3 border-t border-king-border/80 flex items-center justify-between text-xs font-mono">
                                    <span class="text-gray-400 flex items-center gap-1">
                                        <i data-lucide="timer" class="w-3.5 h-3.5 text-red-400"></i> ${topic.time}
                                    </span>
                                    <span class="text-king-gold group-hover:translate-x-1 transition flex items-center gap-1 font-bold">
                                        생존 시작 <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                container.innerHTML = html;
                lucide.createIcons();
            }

            setFilter(category) {
                audio.play('click');
                this.state.filterCategory = category;
                this.goHome();
            }

            startRandomQuiz() {
                audio.play('click');
                const randomIdx = Math.floor(Math.random() * SURVIVAL_TOPICS.length);
                this.startQuiz(SURVIVAL_TOPICS[randomIdx].id);
            }

            startQuiz(topicId) {
                audio.play('click');
                const topic = SURVIVAL_TOPICS.find(t => t.id === topicId);
                if (!topic) return;

                this.state.currentTopic = topic;
                this.state.currentStageIndex = 0;
                this.state.hp = 100;
                this.state.mental = 100;

                this.renderQuizStage();
            }

            clearQuizTimer() {
                if (this.state.timerInterval) {
                    clearInterval(this.state.timerInterval);
                    this.state.timerInterval = null;
                }
            }

            startStageTimer() {
                this.clearQuizTimer();
                this.state.timer = 10;
                this.updateTimerUI();

                this.state.timerInterval = setInterval(() => {
                    this.state.timer--;
                    this.updateTimerUI();

                    if (this.state.timer <= 0) {
                        this.clearQuizTimer();
                        audio.play('damage');
                        this.handleTimeOut();
                    }
                }, 1000);
            }

            updateTimerUI() {
                const timerText = document.getElementById('quizTimerText');
                const timerBar = document.getElementById('quizTimerBar');
                
                if (timerText) timerText.innerText = `${this.state.timer}초`;
                if (timerBar) {
                    const percentage = (this.state.timer / 10) * 100;
                    timerBar.style.width = `${percentage}%`;
                    if (this.state.timer <= 3) {
                        timerBar.className = "h-full bg-red-600 transition-all duration-300";
                    } else if (this.state.timer <= 6) {
                        timerBar.className = "h-full bg-amber-400 transition-all duration-300";
                    } else {
                        timerBar.className = "h-full bg-king-neonGreen transition-all duration-300";
                    }
                }
            }

            handleTimeOut() {
                this.state.hp -= 35;
                this.state.mental -= 35;
                
                if (this.state.hp <= 0 || this.state.mental <= 0) {
                    this.showResult(false, "제한시간 10초 초과로 적절한 대처에 실패했습니다!");
                } else {
                    this.showFeedbackModal("⏱️ 시간 초과!", "10초 내에 선택하지 못하여 극심한 치명상을 입었습니다!", false, () => {
                        this.nextStage();
                    });
                }
            }

            renderQuizStage() {
                const topic = this.state.currentTopic;
                const stage = topic.stages[this.state.currentStageIndex];
                const container = document.getElementById('appContainer');

                const stageProgress = ((this.state.currentStageIndex + 1) / topic.stages.length) * 100;

                container.innerHTML = `
                    <div class="max-w-3xl mx-auto bg-king-card border border-king-border rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
                        
                        <div class="flex items-center justify-between border-b border-king-border pb-4 mb-6">
                            <button onclick="app.goHome()" class="px-3 py-1.5 rounded-xl bg-king-bg border border-king-border text-gray-400 hover:text-white text-xs font-mono transition flex items-center gap-1">
                                <i data-lucide="arrow-left" class="w-4 h-4"></i> 포기하고 메인으로
                            </button>
                            <div class="text-right">
                                <span class="text-xs font-mono text-gray-400 block">${topic.title}</span>
                                <strong class="text-sm font-mono text-king-gold">STAGE ${this.state.currentStageIndex + 1} / ${topic.stages.length}</strong>
                            </div>
                        </div>

                        <div class="w-full bg-king-bg h-2 rounded-full overflow-hidden mb-6 border border-king-border">
                            <div class="h-full bg-gradient-to-r from-king-accent via-king-neonPink to-king-gold transition-all duration-500" style="width: ${stageProgress}%"></div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="bg-king-bg p-3 rounded-2xl border border-king-border">
                                <div class="flex justify-between items-center text-xs font-mono mb-1.5">
                                    <span class="text-red-400 font-bold flex items-center gap-1"><i data-lucide="heart" class="w-3.5 h-3.5 fill-red-400"></i> 신체 체력 (HP)</span>
                                    <span class="text-white font-bold">${this.state.hp} / 100</span>
                                </div>
                                <div class="w-full bg-black/50 h-2.5 rounded-full overflow-hidden">
                                    <div class="h-full bg-red-500 transition-all duration-300" style="width: ${Math.max(0, this.state.hp)}%"></div>
                                </div>
                            </div>

                            <div class="bg-king-bg p-3 rounded-2xl border border-king-border">
                                <div class="flex justify-between items-center text-xs font-mono mb-1.5">
                                    <span class="text-king-neonCyan font-bold flex items-center gap-1"><i data-lucide="brain" class="w-3.5 h-3.5"></i> 멘탈 지수 (MENTAL)</span>
                                    <span class="text-white font-bold">${this.state.mental} / 100</span>
                                </div>
                                <div class="w-full bg-black/50 h-2.5 rounded-full overflow-hidden">
                                    <div class="h-full bg-king-neonCyan transition-all duration-300" style="width: ${Math.max(0, this.state.mental)}%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-red-950/40 border border-red-500/30 p-3 rounded-2xl mb-6 flex items-center justify-between">
                            <div class="flex items-center gap-2 text-xs font-mono text-red-400 font-bold">
                                <i data-lucide="clock" class="w-4 h-4 animate-spin"></i>
                                <span>10초 제한시간 카운트다운</span>
                            </div>
                            <span id="quizTimerText" class="text-lg font-black font-mono text-red-400">10초</span>
                        </div>
                        <div class="w-full bg-black/60 h-1.5 rounded-full overflow-hidden mb-6">
                            <div id="quizTimerBar" class="h-full bg-king-neonGreen transition-all duration-300" style="width: 100%"></div>
                        </div>

                        <div class="bg-king-bg border border-king-border rounded-2xl p-5 mb-6 relative">
                            <div class="flex gap-4 items-start">
                                <img src="${topic.image}" onerror="this.src='https://placehold.co/200x200/101420/ffd700?text=SURVIVAL'" alt="Topic Preview" class="w-20 h-20 rounded-xl object-cover border border-king-border hidden sm:block shrink-0">
                                <div>
                                    <h4 class="text-base font-bold text-king-gold mb-2 flex items-center gap-2">
                                        ⚡ ${stage.title}
                                    </h4>
                                    <p class="text-sm text-gray-200 leading-relaxed font-sans">
                                        ${stage.narrative}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-3">
                            ${stage.options.map((opt, idx) => `
                                <button onclick="app.selectOption(${idx})" class="w-full text-left p-4 rounded-2xl bg-king-card border border-king-border hover:border-king-gold hover:bg-king-cardHover transition flex items-center justify-between group shadow-md">
                                    <span class="text-sm text-gray-200 group-hover:text-white font-medium pr-3">
                                        <strong class="text-king-gold font-mono mr-2">${idx + 1}.</strong>${opt.text}
                                    </span>
                                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500 group-hover:text-king-gold transition shrink-0"></i>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;

                lucide.createIcons();
                this.startStageTimer();
            }

            selectOption(optionIndex) {
                this.clearQuizTimer();
                const topic = this.state.currentTopic;
                const stage = topic.stages[this.state.currentStageIndex];
                const selected = stage.options[optionIndex];

                this.state.hp = Math.min(100, this.state.hp + selected.hp);
                this.state.mental = Math.min(100, this.state.mental + selected.mental);

                const isSuccess = selected.hp >= 0 && selected.mental >= 0;

                if (isSuccess) {
                    audio.play('correct');
                } else {
                    audio.play('damage');
                }

                if (this.state.hp <= 0 || this.state.mental <= 0) {
                    this.showResult(false, selected.feedback);
                    return;
                }

                this.showFeedbackModal(
                    isSuccess ? "✅ 최선의 판단!" : "⚠️ 피해 발생!",
                    `${selected.feedback}<br><br><span class="text-xs text-gray-400 font-mono">체력: ${selected.hp > 0 ? '+' : ''}${selected.hp} | 멘탈: ${selected.mental > 0 ? '+' : ''}${selected.mental}</span>`,
                    isSuccess,
                    () => {
                        this.nextStage();
                    }
                );
            }

            nextStage() {
                const topic = this.state.currentTopic;
                this.state.currentStageIndex++;

                if (this.state.currentStageIndex >= topic.stages.length) {
                    this.showResult(true, "축하합니다! 극한 난이도의 8개 단계를 완벽히 돌파하여 생존 성공!");
                } else {
                    this.renderQuizStage();
                }
            }

            showFeedbackModal(title, bodyHtml, isSuccess, callback) {
                const modal = document.createElement('div');
                modal.className = "fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in";
                
                modal.innerHTML = `
                    <div class="bg-king-card border ${isSuccess ? 'border-king-neonGreen' : 'border-red-500'} rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
                        <h3 class="text-xl font-bold ${isSuccess ? 'text-king-neonGreen' : 'text-red-400'} mb-3">${title}</h3>
                        <p class="text-sm text-gray-200 mb-6 leading-relaxed">${bodyHtml}</p>
                        <button id="feedbackNextBtn" class="w-full py-3 rounded-xl ${isSuccess ? 'bg-king-neonGreen text-black' : 'bg-red-600 text-white'} font-bold text-sm hover:opacity-90 transition">
                            다음 단계로 진행
                        </button>
                    </div>
                `;

                document.body.appendChild(modal);
                document.getElementById('feedbackNextBtn').onclick = () => {
                    audio.play('click');
                    document.body.removeChild(modal);
                    callback();
                };
            }

            showResult(isVictory, finalMsg) {
                this.clearQuizTimer();
                this.state.attempts++;

                const topic = this.state.currentTopic;
                const score = isVictory ? Math.max(100, (this.state.hp + this.state.mental) * 5) : 0;

                if (isVictory) {
                    this.state.wins++;
                    audio.play('victory');
                    if (confetti) {
                        confetti({
                            particleCount: 120,
                            spread: 80,
                            origin: { y: 0.6 }
                        });
                    }

                    if (!this.state.unlockedBadges.includes(topic.id)) {
                        this.state.unlockedBadges.push(topic.id);
                        localStorage.setItem('sk_badges', JSON.stringify(this.state.unlockedBadges));
                    }

                    if (score > this.state.highScore) {
                        this.state.highScore = score;
                        localStorage.setItem('sk_highScore', this.state.highScore);
                    }

                    this.state.leaderboard.push({
                        name: this.state.nickname,
                        score: score,
                        date: new Date().toISOString().split('T')[0],
                        title: score >= 900 ? '생존신' : '생존왕'
                    });
                    this.state.leaderboard.sort((a, b) => b.score - a.score);
                    this.state.leaderboard = this.state.leaderboard.slice(0, 10);
                    localStorage.setItem('sk_leaderboard', JSON.stringify(this.state.leaderboard));

                } else {
                    audio.play('gameover');
                }

                localStorage.setItem('sk_attempts', this.state.attempts);
                localStorage.setItem('sk_wins', this.state.wins);

                const container = document.getElementById('appContainer');

                container.innerHTML = `
                    <div class="max-w-xl mx-auto bg-king-card border ${isVictory ? 'border-king-gold glow-gold' : 'border-red-600'} rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
                        
                        <div class="w-20 h-20 rounded-3xl ${isVictory ? 'bg-gradient-to-br from-king-gold to-amber-600 text-black' : 'bg-red-950 border border-red-500 text-red-500'} mx-auto flex items-center justify-center text-4xl font-black mb-6 shadow-xl">
                            ${isVictory ? '👑' : '💀'}
                        </div>

                        <h2 class="text-3xl font-black ${isVictory ? 'text-king-gold' : 'text-red-500'} mb-2">
                            ${isVictory ? '생존 성공 (SURVIVED)!' : '생존 실패 (GAME OVER)'}
                        </h2>

                        <p class="text-xs font-mono text-gray-400 mb-6">[${topic.title}]</p>

                        <p class="text-sm text-gray-200 leading-relaxed mb-6 bg-king-bg p-4 rounded-2xl border border-king-border">
                            ${finalMsg}
                        </p>

                        ${isVictory ? `
                            <div class="grid grid-cols-2 gap-3 mb-6 font-mono text-xs">
                                <div class="bg-king-bg p-3 rounded-xl border border-king-border">
                                    <span class="text-gray-400 block">최종 생존 점수</span>
                                    <strong class="text-lg font-black text-king-neonCyan">${score} pts</strong>
                                </div>
                                <div class="bg-king-bg p-3 rounded-xl border border-king-border">
                                    <span class="text-gray-400 block">획득 훈장</span>
                                    <strong class="text-sm font-bold text-king-gold">${topic.badge}</strong>
                                </div>
                            </div>
                        ` : ''}

                        <div class="flex items-center gap-3">
                            <button onclick="app.startQuiz('${topic.id}')" class="flex-1 py-3.5 rounded-2xl bg-king-gold text-black font-bold text-sm hover:bg-amber-300 transition shadow-lg">
                                다시 도전하기
                            </button>
                            <button onclick="app.goHome()" class="flex-1 py-3.5 rounded-2xl bg-king-bg border border-king-border text-white font-bold text-sm hover:bg-king-card transition">
                                메인 화면으로
                            </button>
                        </div>
                    </div>
                `;

                lucide.createIcons();
            }

            openNicknameModal() {
                audio.play('click');
                document.getElementById('nicknameInput').value = this.state.nickname;
                document.getElementById('nicknameModal').classList.remove('hidden');
            }

            closeNicknameModal() {
                document.getElementById('nicknameModal').classList.add('hidden');
            }

            saveNickname() {
                audio.play('click');
                const val = document.getElementById('nicknameInput').value.trim();
                if (val) {
                    this.state.nickname = val;
                    localStorage.setItem('sk_nickname', val);
                    this.updateHeaderUI();
                    this.closeNicknameModal();
                    this.showToast("닉네임이 변경되었습니다.");
                }
            }

            openStatsModal() {
                audio.play('click');
                this.updateStatsModalUI();
                document.getElementById('statsModal').classList.remove('hidden');
            }

            closeStatsModal() {
                document.getElementById('statsModal').classList.add('hidden');
            }

            switchModalTab(tab) {
                audio.play('click');
                this.state.activeModalTab = tab;
                this.updateStatsModalUI();
            }

            updateStatsModalUI() {
                let tier = "🥉 브론즈";
                if (this.state.highScore >= 900) tier = "👑 킹 (최상위)";
                else if (this.state.highScore >= 700) tier = "🥇 골드";
                else if (this.state.highScore >= 400) tier = "🥈 실버";

                document.getElementById('statRankTier').innerText = tier;
                document.getElementById('statHighScore').innerText = `${this.state.highScore} pts`;
                
                const rate = this.state.attempts > 0 ? Math.round((this.state.wins / this.state.attempts) * 100) : 0;
                document.getElementById('statSurvivalRate').innerText = `${rate}% (${this.state.attempts}회)`;

                const tabLeaderboardBtn = document.getElementById('tabLeaderboardBtn');
                const tabBadgesBtn = document.getElementById('tabBadgesBtn');
                const content = document.getElementById('modalTabContent');

                if (this.state.activeModalTab === 'leaderboard') {
                    tabLeaderboardBtn.className = "py-2 px-4 border-b-2 border-king-gold text-king-gold font-bold";
                    tabBadgesBtn.className = "py-2 px-4 border-b-2 border-transparent text-gray-400 hover:text-white font-bold";

                    let listHtml = `<div class="space-y-2">`;
                    this.state.leaderboard.forEach((item, idx) => {
                        listHtml += `
                            <div class="flex items-center justify-between p-3 rounded-xl bg-king-bg border border-king-border text-xs font-mono">
                                <div class="flex items-center gap-3">
                                    <span class="w-6 text-center font-black ${idx === 0 ? 'text-king-gold text-sm' : idx === 1 ? 'text-gray-300' : idx === 2 ? 'text-amber-600' : 'text-gray-500'}">
                                        ${idx + 1}
                                    </span>
                                    <div>
                                        <p class="font-bold text-white">${item.name}</p>
                                        <p class="text-[10px] text-gray-500">${item.date}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <strong class="text-king-neonCyan font-black">${item.score} pts</strong>
                                    <span class="block text-[10px] text-king-gold font-bold">${item.title}</span>
                                </div>
                            </div>
                        `;
                    });
                    listHtml += `</div>`;
                    content.innerHTML = listHtml;

                } else {
                    tabBadgesBtn.className = "py-2 px-4 border-b-2 border-king-gold text-king-gold font-bold";
                    tabLeaderboardBtn.className = "py-2 px-4 border-b-2 border-transparent text-gray-400 hover:text-white font-bold";

                    let badgeHtml = `<div class="grid grid-cols-2 gap-3">`;
                    SURVIVAL_TOPICS.forEach(topic => {
                        const unlocked = this.state.unlockedBadges.includes(topic.id);
                        badgeHtml += `
                            <div class="p-3 rounded-xl border ${unlocked ? 'border-king-gold/60 bg-king-card' : 'border-king-border bg-king-bg/50 opacity-50'} text-xs font-mono">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-lg">${unlocked ? '🎖️' : '🔒'}</span>
                                    <strong class="${unlocked ? 'text-king-gold' : 'text-gray-400'} font-bold">${topic.badge}</strong>
                                </div>
                                <p class="text-[10px] text-gray-400 leading-tight">${topic.badgeDesc}</p>
                            </div>
                        `;
                    });
                    badgeHtml += `</div>`;
                    content.innerHTML = badgeHtml;
                }
            }
        }

        let app;
        window.onload = function() {
            app = new SurvivalApp();
            app.init();
        };
    </script>
</body>
</html>
